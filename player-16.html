<script>
/* محمّل مكتبات مرن: لو مصدر CDN الأساسي فشل أو تأخر (بطء شبكة/حجب جزئي)، يجرب مصادر بديلة تلقائيًا
   بدل ما يفشل تشغيل الفيديو بالكامل بصمت لمجرد إن مكتبة واحدة ما وصلت */
function loadLibWithFallback(globalName, urls, idx){
  idx = idx || 0;
  if (idx >= urls.length) return;
  if (window[globalName]) return; // وصلت من محاولة سابقة أثناء الانتظار
  const s = document.createElement('script');
  s.src = urls[idx];
  s.onload = function(){ /* توصلت، لا شيء إضافي مطلوب */ };
  s.onerror = function(){ loadLibWithFallback(globalName, urls, idx+1); };
  document.head.appendChild(s);
  // لو تأخرت المحاولة الحالية أكثر من 6 ثوانٍ بلا نتيجة، نبدأ نحمّل المصدر التالي بالتوازي (لا ننتظرها تفشل رسميًا)
  setTimeout(function(){ if (!window[globalName]) loadLibWithFallback(globalName, urls, idx+1); }, 6000);
}
loadLibWithFallback('Hls', [
  'https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js',
  'https://unpkg.com/hls.js@1.5.13/dist/hls.min.js'
]);
loadLibWithFallback('dashjs', [
  'https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js',
  'https://unpkg.com/dashjs@4.7.4/dist/dash.all.min.js'
]);
loadLibWithFallback('mpegts', [
  'https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js',
  'https://unpkg.com/mpegts.js@1.7.3/dist/mpegts.min.js'
]);
loadLibWithFallback('shaka', [
  'https://cdn.jsdelivr.net/npm/shaka-player@4.10.5/dist/shaka-player.compiled.js',
  'https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.10.5/shaka-player.compiled.js',
  'https://unpkg.com/shaka-player@4.10.5/dist/shaka-player.compiled.js'
]);
// دالة مساعدة: تنتظر مكتبة معيّنة تتحمّل (لو لسه بالطريق) قبل ما نحكم عليها بالفشل النهائي، بحد أقصى معقول
function waitForLib(globalName, maxMs){
  return new Promise(resolve=>{
    if (window[globalName]) return resolve(true);
    const start = Date.now();
    const iv = setInterval(()=>{
      if (window[globalName]){ clearInterval(iv); resolve(true); }
      else if (Date.now() - start > maxMs){ clearInterval(iv); resolve(false); }
    }, 200);
  });
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --acc:#E87B00; --acc2:#FF9520;
  --bg:#070707; --card:#141414; --card2:#1c1c1c; --border:#262626;
  --txt:#F2F2F2; --mute:#7a7a7a; --live:#D32F2F; --tg-safe-top:0px;
}
body[data-club="milan"]{ --acc:#E2101A; --acc2:#FF4747; }
body[data-club="barca"]{ --acc:#A50044; --acc2:#1E6DE0; }
#tickerBar{position:fixed;top:0;left:0;right:0;height:var(--tg-safe-top);min-height:0;overflow:hidden;
  background:#000;z-index:10000;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;}
#tickerText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:11px;font-weight:800;color:#fff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--txt);font-family:'Cairo',sans-serif;height:100%;overflow:hidden;}
img{display:block;}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;}
.hide{display:none!important;}
::-webkit-scrollbar{display:none;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;height:100%;background:var(--bg);}

/* ===== هيدر ===== */
.top-bar{display:flex;align-items:center;gap:10px;padding:calc(14px + var(--tg-safe-top)) 14px 10px;flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--border);}
.embed-toolbar{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:20;gap:6px;transition:opacity .4s;}
.embed-toolbar.dim{opacity:.35;}
.embed-toolbar:not(.hide){display:flex;}
.embed-toolbar button{width:34px;height:34px;border-radius:8px;background:rgba(0,0,0,.6);border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.embed-toolbar button svg{width:17px;height:17px;fill:#fff;}
body.fs-lock .embed-toolbar{z-index:10000;}
.icon-btn{width:34px;height:34px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-btn svg{width:19px;height:19px;fill:#fff;}
.top-crest{height:28px;width:auto;max-width:64px;object-fit:contain;flex-shrink:0;}
.top-title{font-size:16px;font-weight:800;flex:1;}
.top-zone{font-size:12px;font-weight:800;color:var(--acc);letter-spacing:1px;}
.bdot{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.6s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.85}}

/* ===== زر LIVE داخل شريط الأزرار: أحمر ووامض عند نقطة البث الفعلية، رمادي وثابت إذا تأخر البث
   عن اللحظة الحية أكثر من 5 ثوانٍ (بغض النظر عن السبب: تخزين مؤقت، تعليق مؤقت...) ===== */
.live-indicator{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.5px;padding:0 2px;}
.live-indicator .ldot{width:7px;height:7px;border-radius:50%;background:var(--mute);flex-shrink:0;}
.live-indicator.at-edge{color:var(--live);}
.live-indicator.at-edge .ldot{background:var(--live);animation:blink 1.4s ease-in-out infinite;}
.live-indicator.delayed{color:var(--mute);}
.live-indicator.delayed .ldot{background:var(--mute);animation:none;}

/* تعليم الخيار الحالي (الجودة/الصوت/الأبعاد) داخل القوائم المنبثقة باللون الأحمر، عشان المستخدم
   يعرف فورًا وش الوضع الحالي المفعّل بدون ما يفتح ويقارن يدويًا */
.popup-menu .menu-active{color:var(--live)!important;font-weight:900!important;}

/* ===== صفحة المشغل ===== */
.player-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;}
#playerWrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;flex-shrink:0;}
#playerWrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#playerWrap.ar-cover video{object-fit:cover;}
#playerWrap.ar-fill video{object-fit:fill;}
#playerWrap.ar-9x16:not(.fs):not(:fullscreen){aspect-ratio:9/16;}
#playerWrap.ar-9x16 video{object-fit:cover;}
#playerWrap.ar-16x9:not(.fs):not(:fullscreen){aspect-ratio:16/9;}
#playerWrap.ar-16x9 video{object-fit:contain;}
#playerWrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;}
#playerPlaceholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0d0d0d,#000);color:var(--mute);font-size:12px;flex-direction:column;gap:10px;z-index:2;}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.08);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#liveBadgeP{position:absolute;top:10px;right:10px;z-index:6;background:var(--live);color:#fff;font-size:10px;font-weight:800;
  padding:4px 10px;border-radius:6px;display:none;align-items:center;gap:5px;}
#playerToast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);z-index:15;background:rgba(20,20,20,.94);
  color:#fff;font-size:12px;padding:9px 16px;border-radius:20px;max-width:88%;text-align:center;
  border:1px solid rgba(255,255,255,.1);transition:opacity .25s;}
#playerToast.hide{opacity:0;pointer-events:none;}
/* في وضع الفول سكرين نخفي شارة "مباشر" الحمراء أعلى اليمين، وتبقى ظاهرة فقط في الوضع العادي */
#playerWrap.fs #liveBadgeP{display:none!important;}
/* زر إغلاق الفول سكرين: ثابت أعلى اليمين دائمًا (بمعزل عن ظهور/اختفاء بقية الأزرار)، ليسهل الوصول إليه فورًا */
#btnFSClose{position:absolute;top:12px;right:12px;z-index:20;width:38px;height:38px;border-radius:50%;
  background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;}
#btnFSClose svg{width:18px;height:18px;fill:#fff;}
#playerWrap.fs .ctrl-layer #btnFSClose{display:flex;}
/* سهم السيرفرات: يظهر بوضع الفول سكرين فقط، لأن القنوات ظاهرة أصلاً أسفل المشغل بالوضع العادي ولا داعي لتكراره */
#playerWrap:not(.fs) #btnServers{display:none!important;}
.ctrl-layer{position:absolute;inset:0;z-index:5;opacity:0;transition:opacity .2s;pointer-events:none;}
#playerWrap.show .ctrl-layer{opacity:1;pointer-events:all;}
.ctrl-layer .top-grad{position:absolute;top:0;left:0;right:0;height:60px;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);}
.ctrl-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:46px;}
.ctrl-center button{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;}
.ctrl-center button svg{width:26px;height:26px;fill:#fff;}
.ctrl-center .big{width:64px;height:64px;background:rgba(0,0,0,.5);}
.ctrl-center .big svg{width:30px;height:30px;}
.ctrl-bottom{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;
  background:linear-gradient(to top,rgba(0,0,0,.9),transparent);display:flex;flex-direction:column;gap:6px;}
.seek-row{display:flex;align-items:center;gap:8px;}
.seek-row input[type=range]{flex:1;height:3px;-webkit-appearance:none;background:rgba(255,255,255,.25);border-radius:3px;}
.seek-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--acc);}
.time-txt{font-size:10px;color:#ddd;min-width:34px;text-align:center;}
.bottom-btns{display:flex;align-items:center;justify-content:center;gap:28px;}
.bottom-btns .left,.bottom-btns .right{display:flex;align-items:center;gap:14px;}
.bottom-btns button svg{width:19px;height:19px;fill:#fff;}
.live-flat{font-size:11px;font-weight:800;color:var(--live);display:flex;align-items:center;gap:5px;}

/* فول سكرين: نعتمد دائمًا على كلاس .fs + الاتجاه الفعلي الحالي للجهاز (media query) بدل الاعتماد
   على أي واجهة فول سكرين واحدة بعينها — لأن بعضها (مثل فول سكرين تيليجرام نفسه) يخفي الشريط العلوي
   فقط ولا يكبّر عنصر الفيديو تلقائيًا، فنحتاج نكبّره نحن بأنفسنا دائمًا بغض النظر عن الطريقة الناجحة */
body.fs-lock{overflow:hidden!important;}
body.fs-lock .top-bar,body.fs-lock .nav-bar,body.fs-lock .below-player,body.fs-lock #tickerBar{display:none!important;}
/* فول سكرين: تدوير بصري بـ CSS بحت لعرض الفيديو أفقيًا داخل شاشة الجهاز العمودية (هذا لا يُدوّر الجهاز
   فعليًا؛ فقط يعرض صندوق المشغل نفسه أفقيًا بصريًا)، مع ملاحظة أن الصندوق يدور كوحدة واحدة متكاملة بكل
   ما فيه (الفيديو + كل الأزرار)، فتبقى مواقع الأزرار صحيحة ومتسقة نسبةً لبعضها بعد التدوير دون أي تفرّق */
#playerWrap.fs{position:fixed!important;top:0;left:0;z-index:9999!important;background:#000!important;}
@media (orientation:portrait){
  #playerWrap.fs{
    width:100dvh!important;height:100dvw!important;
    max-height:none!important;aspect-ratio:unset!important;transform-origin:0 0;
    transform:rotate(90deg) translateY(-100%)!important;
  }
}
@media (orientation:landscape){
  #playerWrap.fs{inset:0!important;width:100%!important;height:100%!important;
    max-height:none!important;aspect-ratio:unset!important;transform:none!important;}
}

/* القوائم المنبثقة (جودة/أبعاد/سيرفرات/صوت): عمودية طبيعية بالوضع العادي، وأفقية داخل الفول سكرين (بحيث
   تظهر عمودية بصريًا على الشاشة الفعلية بعد دوران الصندوق كامل 90 درجة) — بكلتا الحالتين نحدد حدًا أقصى
   مع تمرير حتى لا تمتد القائمة لبرا حدود صندوق الفيديو مهما زاد عدد الخيارات */
.popup-menu{display:flex;flex-direction:column;max-height:230px;overflow-y:auto;overflow-x:hidden;}
#playerWrap.fs .popup-menu{flex-direction:row;max-height:none;max-width:75dvh;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;}
#playerWrap.fs .popup-menu > div{white-space:nowrap;flex-shrink:0;}

.below-player{padding:18px 16px;}
.tabs-row{display:flex;gap:10px;margin-bottom:14px;}
.tab-btn{flex:1;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--border);
  font-size:13px;font-weight:800;color:var(--mute);text-align:center;}
.tab-btn.active{background:var(--acc);color:#fff;border-color:var(--acc);}
.teams-row{display:flex;align-items:center;justify-content:center;gap:30px;padding:18px 0 8px;}
.team-col{display:flex;flex-direction:column;align-items:center;gap:9px;width:100px;}
.team-col .logo-holder{height:56px;display:flex;align-items:center;justify-content:center;}
.team-col .logo-holder img{max-height:100%;max-width:90px;width:auto;object-fit:contain;}
.team-col span{font-size:12px;font-weight:700;text-align:center;line-height:1.3;}
.vs-txt{font-size:13px;font-weight:900;color:var(--mute);}
.match-meta{text-align:center;font-size:11px;color:var(--mute);margin-top:-6px;margin-bottom:6px;}
.sec-title{font-size:13px;font-weight:800;color:var(--mute);margin:16px 0 10px;}
.chips-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.chip{padding:9px 16px;border-radius:9px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:700;}
.chip.active{background:var(--acc);border-color:var(--acc);color:#fff;}
.related-scroll{display:flex;gap:10px;overflow-x:auto;padding-top:4px;}
.info-note{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px;
  white-space:pre-line;font-size:13px;color:var(--txt);line-height:1.7;}
.info-note b{color:var(--acc);}

/* ===== بطاقة مباراة (تصميم الهَب: مستخدمة لبطاقات "مباريات برشلونة") ===== */
.hub-list{display:flex;flex-direction:column;gap:14px;margin-top:4px;}
.hub-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px 16px;transition:border-color .15s;}
.hub-card.active{border-color:var(--acc);}
.hub-card-top{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:10px;}
.hub-badge{background:var(--acc);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:6px;flex-shrink:0;}
.hub-comp{font-size:11px;color:var(--mute);font-weight:700;}
.hub-teams{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.hub-team{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0;}
.hub-logo{width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hub-logo img{max-width:100%;max-height:100%;object-fit:contain;}
.hub-team span{font-size:11.5px;font-weight:700;text-align:center;line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hub-time{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;padding:0 8px;}
.hub-t{font-size:15px;font-weight:900;color:var(--acc);}
.hub-d{font-size:10px;color:var(--mute);}
.hub-live{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:900;color:var(--live);white-space:nowrap;}

/* ===== بطاقة مباراة (تصميم الهَب) ===== */

.hub-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px 16px;transition:border-color .15s;}
.hub-card.active{border-color:var(--acc);}
.hub-card-top{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:10px;}

.hub-logo img{max-width:100%;max-height:100%;object-fit:contain;}

/* فول سكرين: تدوير بصري بـ CSS بحت */
body.fs-lock{overflow:hidden!important;}
body.fs-lock .top-bar,body.fs-lock #tickerBar{display:none!important;}
#playerWrap.fs{position:fixed!important;top:0;left:0;z-index:9999!important;background:#000!important;}
@media (orientation:portrait){
  #playerWrap.fs{
    width:100dvh!important;height:100dvw!important;
    max-height:none!important;aspect-ratio:unset!important;transform-origin:0 0;
    transform:rotate(90deg) translateY(-100%)!important;
  }
}

  #playerWrap.fs{inset:0!important;width:100%!important;height:100%!important;
    max-height:none!important;aspect-ratio:unset!important;transform:none!important;}
}
</style>
</head>
<body>
<div id="tickerBar"><div id="tickerText"></div></div>
<div id="app">
  <div class="top-bar">
    <button class="icon-btn" onclick="closePlayer()">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div class="top-title" id="playerTitle">المباراة</div>
    <div class="top-zone">ZONE</div>
  </div>
  <div id="playerWrap" onclick="onPlayerTap(event)">
    <div class="embed-toolbar hide" id="embedToolbar">
      <button onclick="event.stopPropagation();toggleAspectMenu();armEmbedToolbarDim();" id="btnEmbedAspect" title="أبعاد العرض">

<script>
/* ============================================================================================
   مشغل ZONE — صفحة مستقلة تمامًا (تنقّل حقيقي، وليس iframe مضمّن داخل index.html).
   الاستخدام: player.html?club=milan  أو  player.html?club=barca
   ============================================================================================ */
const SUPABASE_URL = 'https://ckriyvqnrzravknajckl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_rFMfYa3nWxyxp6_zYUdtCw_znCYEKfV';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============== Telegram Mini App ============== */
try{
  if (window.Telegram && window.Telegram.WebApp){
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    if (typeof Telegram.WebApp.requestFullscreen === 'function'){
      try{ Telegram.WebApp.requestFullscreen(); }catch(e){}
    }
    function applyTgSafeArea(){
      const c = Telegram.WebApp.contentSafeAreaInset || {};
      const s = Telegram.WebApp.safeAreaInset || {};
      const top = (c.top||0) + (s.top||0);
      document.documentElement.style.setProperty('--tg-safe-top', top + 'px');
    }
    applyTgSafeArea();
    if (typeof Telegram.WebApp.onEvent === 'function'){
      Telegram.WebApp.onEvent('contentSafeAreaChanged', applyTgSafeArea);
      Telegram.WebApp.onEvent('safeAreaChanged', applyTgSafeArea);
      Telegram.WebApp.onEvent('fullscreenChanged', applyTgSafeArea);
    }
    try{ if (typeof Telegram.WebApp.setHeaderColor === 'function') Telegram.WebApp.setHeaderColor('#000000'); }catch(e){}
  }
}catch(e){}

/* ============== الحالة ============== */
let CLUB_NAMES = {}; // يُعبّأ ديناميكيًا من جدول clubs بدل قيم ثابتة بالكود
let state = { club:null, currentMatch:null, sources:[], related:[], currentTab:'live', currentSource:null, barcaHubCards:null, clubTelegram:null, clubInfo:null };

/* ============== شريط الأخبار العلوي (ticker) فقط — بقية إعدادات app_settings خاصة بصفحة اختيار النادي ============== */
async function loadTicker(){
  try{
    const { data } = await sb.from('app_settings').select('*').eq('id', 1).single();
    if (data && data.ticker_text) document.getElementById('tickerText').textContent = data.ticker_text;
  }catch(e){}
}
loadTicker();

async function openClub(club){
  state.club = club;
  document.body.setAttribute('data-club', club);
  await loadClubInfo(club);
  await renderBarcaHub();
}
// تصميم مخصص لصفحة برشلونة: المشغل أعلى الصفحة مباشرة، السيرفرات تحته (إن وجدت)، وتحتها بطاقات المباريات
// (سابقة/قادمة، أو مباشر/سابقة لو فيه مباراة مباشرة الآن) والتنقل بينها يتم داخل نفس الصفحة دون أي
// إعادة تحميل/انتقال يُشعر المستخدم بالدخول لصفحة جديدة — الشاشة تُعرض مرة واحدة فقط هنا (show)
async function renderBarcaHub(){
  const club = state.club;
  state.barcaHubCards = null;
  document.getElementById('playerTitle').textContent = CLUB_NAMES[club] || '';
  await resetPlayerUI();
  document.getElementById('belowPlayer').innerHTML = '';
  const { data } = await sb.from('matches').select('*').eq('club', club);
  const now = Date.now();
  const matches = (data || []).filter(m => !m.publish_at || new Date(m.publish_at).getTime() <= now);
  if (!matches.length){
    showPlaceholder('لا توجد مباريات مضافة حالياً', false);
    return;
  }
  // تُعرض كل المباريات المضافة للنادي (بلا حد أقصى)، مرتّبة: المباشرة أولاً، ثم القادمة (الأقرب فالأبعد)،
  // ثم المنتهية (الأحدث فالأقدم) — وتُفتح تلقائيًا أنسب مباراة حسب نفس الترتيب
  const live = matches.filter(m=>m.status==='live');
  const upcoming = matches.filter(m=>m.status==='upcoming')
    .sort((a,b)=> new Date(a.kickoff_at||0) - new Date(b.kickoff_at||0));
  const finished = matches.filter(m=>m.status==='finished')
    .sort((a,b)=> new Date(b.kickoff_at||0) - new Date(a.kickoff_at||0));
  const cards = [...live, ...upcoming, ...finished];
  state.barcaHubCards = cards;
  const initial = live[0] || upcoming[0] || finished[0];
  await loadBarcaMatch(initial.id);
}
// تحميل مباراة داخل هَب النادي دون الخروج من الشاشة أو التلميح بأي "تحميل صفحة" — فقط تحديث
// الفيديو والعنوان والسيرفرات وبطاقات المباريات في مكانها
async function loadBarcaMatch(matchId){
  await resetPlayerUI();
  const { data:m } = await sb.from('matches').select('*').eq('id', matchId).single();
  if (!m) return;
  state.currentMatch = m;
  // العنوان يبقى ثابتًا باسم النادي دائمًا (هذي صفحة نادٍ وليست صفحة مباراة منفردة)
  document.getElementById('playerTitle').textContent = CLUB_NAMES[state.club] || '';
  const { data:sources } = await sb.from('match_sources').select('*').eq('match_id', matchId).order('sort_order');
  const now = Date.now();
  state.sources = (sources || []).filter(s => !s.publish_at || new Date(s.publish_at).getTime() <= now);
  state.related = [];
  state.currentTab = m.type==='live' ? 'live' : 'full';
  renderBelowPlayer();
  loadTabSources();
}
async function loadClubInfo(club){
  const { data } = await sb.from('clubs').select('*').eq('slug', club).single();
  state.clubInfo = data || null;
  state.clubTelegram = data ? { link: data.telegram_link||'', label: data.telegram_label||'' } : null;
  if (data){
    CLUB_NAMES[club] = data.name || club;
    if (data.accent_color) document.body.style.setProperty('--acc', data.accent_color);
    if (data.accent_color2) document.body.style.setProperty('--acc2', data.accent_color2);
  }
  const url = data && data.logo_url;
  if (!url) return;
  ['homeCrest','finCrest'].forEach(id=>{
    const el = document.getElementById(id);
    if (!el) return;
    const img = document.createElement('img');
    img.src = url; img.alt=''; img.className='top-crest';
    img.onerror = ()=>{}; // يبقى الحرف كما هو إذا فشل تحميل الشعار
    img.onload = ()=>{ el.replaceWith(img); img.id = id; };
  });
}
function backToClubs(){ location.href = 'index.html'; }
function crestImg(club,size,id){
  const bg = club==='milan' ? 'linear-gradient(135deg,#E2101A,#7a0a0f)' : 'linear-gradient(135deg,#A50044,#004D98)';
  const letter = club==='milan' ? 'M' : 'B';
  return `<div id="${id}" style="width:${size}px;height:${size}px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:${size*0.45}px;flex-shrink:0;background:${bg};">${letter}</div>`;
}

/* ============== تنسيق الوقت ============== */
function fmtKickoff(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('ar', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' });
}
function fmtTimeOnly(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleString('ar', { hour:'2-digit', minute:'2-digit' });
}
function fmtDateOnly(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleString('ar', { day:'2-digit', month:'2-digit' });
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// بطاقة مباراة بتصميم "الهَب" (مستخدمة لبطاقات مباريات برشلونة): شعار واسم كل نادٍ فقط، وقت المباراة
// وتاريخها بالمنتصف، وفوق يمين البطاقة الجولة وبجانبها البطولة — بدون ناقل/ثمبنيل
function barcaMatchCenter(m){
  if (m.status === 'live'){
    return `<div class="hub-time"><span class="hub-live"><span class="bdot"></span>مباشر</span></div>`;
  }
  if (m.status === 'finished'){
    const hasScore = m.home_score !== null && m.home_score !== undefined && m.away_score !== null && m.away_score !== undefined;
    return `<div class="hub-time">${hasScore ? `<span class="hub-t">${m.home_score} - ${m.away_score}</span>` : ''}<span class="hub-d">انتهت</span></div>`;
  }
  return `<div class="hub-time"><span class="hub-t">${fmtTimeOnly(m.kickoff_at)}</span><span class="hub-d">${fmtDateOnly(m.kickoff_at)}</span></div>`;
}
function barcaMatchCard(m){
  const active = state.currentMatch && state.currentMatch.id === m.id;
  return `<div class="hub-card ${active?'active':''}" onclick="loadBarcaMatch('${m.id}')">
    ${(m.round || m.competition) ? `<div class="hub-card-top">
      ${m.competition?`<span class="hub-comp">${escapeHtml(m.competition)}</span>`:''}
      ${m.round?`<span class="hub-badge">${escapeHtml(String(m.round))}</span>`:''}
    </div>` : ''}
    <div class="hub-teams">
      <div class="hub-team"><div class="hub-logo"><img src="${m.home_logo||''}" alt="" onerror="this.style.opacity=0"></div><span>${escapeHtml(m.home_team||'')}</span></div>
      ${barcaMatchCenter(m)}
      <div class="hub-team"><div class="hub-logo"><img src="${m.away_logo||''}" alt="" onerror="this.style.opacity=0"></div><span>${escapeHtml(m.away_team||'')}</span></div>
    </div>
  </div>`;
}

function currentTabSources(){
  return state.sources.filter(s=>s.tab===state.currentTab);
}
function loadTabSources(){
  const m = state.currentMatch;
  const list = currentTabSources();
  if (list.length){
    // فيه محتوى مضاف فعليًا (أي نوع)، نشغّله بدون قيود حتى لو الحالة "قادمة"
    loadSource(list[0].url, list[0]);
  } else if (m.status === 'upcoming'){
    showUpcomingState(m);
  } else {
    showPlaceholder('لا يوجد رابط متاح حالياً', true);
  }
  renderBelowPlayer();
}
let countdownTimer = null;
function showUpcomingState(m){
  destroyPlayer();
  clearInterval(countdownTimer);
  const v = video();
  v.poster = m.thumbnail_url || '';
  currentIsLive = false; updateLiveIndicator();
  document.getElementById('liveBadgeP').style.display = 'none';
  document.getElementById('seekRow').style.display = 'none';
  document.getElementById('btnBack10').style.display = 'none';
  document.getElementById('btnFwd10').style.display = 'none';
  document.getElementById('ctrlLayer').classList.add('hide');
  const p = document.getElementById('playerPlaceholder');
  const note = (m.upcoming_note || '').trim();
  p.innerHTML = `
    <svg viewBox="0 0 24 24" style="width:34px;height:34px;fill:var(--acc)"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 11h-2V7h2zm0 4h-2v-2h2z"/></svg>
    <span style="font-weight:800;color:#fff;">المباراة لم تبدأ بعد</span>
    <span style="font-size:12px;">موعد الانطلاق: ${fmtKickoff(m.kickoff_at) || 'قريبًا'}</span>
    <span id="kickoffCountdown" style="font-size:18px;font-weight:900;color:var(--acc);margin-top:4px;letter-spacing:.5px;"></span>
    ${note ? `<span style="font-size:12.5px;color:#ddd;max-width:280px;text-align:center;line-height:1.5;margin-top:2px;">${escapeHtml(note)}</span>` : ''}`;
  p.classList.remove('hide');
  const target = m.kickoff_at ? new Date(m.kickoff_at).getTime() : null;
  const el = document.getElementById('kickoffCountdown');
  function tick(){
    if (!target || !el) { clearInterval(countdownTimer); return; }
    const diff = target - Date.now();
    if (diff <= 0){ el.textContent = 'على وشك الانطلاق'; clearInterval(countdownTimer); return; }
    const d = Math.floor(diff/86400000);
    const h = Math.floor((diff%86400000)/3600000);
    const mi = Math.floor((diff%3600000)/60000);
    const s = Math.floor((diff%60000)/1000);
    el.textContent = d>0
      ? `يبدأ بعد ${d} يوم ${h} س ${mi} د`
      : `يبدأ بعد ${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}
/* ============== صفحة نادي برشلونة: عرض مستقل بالكامل عن منطق "صفحة المباراة" ==============
   لا تشترك هذه الدالة بأي جزء من renderBelowPlayer (الخاصة بميلان) — فقط: سيرفرات إن وُجدت،
   ثم قائمة كل مباريات برشلونة المضافة، ثم قناة تيليجرام إن وُجدت */
function renderBarcaBelow(){
  let html = '';
  const chips = currentTabSources();
  if (chips.length){
    html += `<div class="chips-row" id="chipsRow">${chips.map((s,i)=>`<div class="chip ${i===0?'active':''}" onclick="pickSource(${i},this)">${escapeHtml(s.label)}</div>`).join('')}</div>`;
  }
  if (state.barcaHubCards && state.barcaHubCards.length){
    html += `<div class="hub-list">${state.barcaHubCards.map(barcaMatchCard).join('')}</div>`;
  }
  document.getElementById('belowPlayer').innerHTML = html;
  setServersButtonVisibility();
  const tg = state.clubTelegram;
  if (tg && tg.link){
    document.getElementById('belowPlayer').insertAdjacentHTML('beforeend', `

  };

}

// نمط روابط بورتالات Xtream-Codes الشهيرة: /live/user/pass/id أو /user/pass/id مباشرة بلا كلمة live
// غالبًا بلا امتداد ظاهر، أو بامتداد .ts لتدفق مباشر خام يحتاج مشغّل MPEG-TS (mpegts.js) بدل <video> العادي
function isXtreamLiveUrl(url){
  if (/\/(movie|series)\//i.test(url)) return false; // مسارات الفيديو المسجل (أفلام/مسلسلات) — ليست بثًا مباشرًا
  if (/\/live\//i.test(url)) return true;
  return /^https?:\/\/[^\/]+\/[^\/?#]+\/[^\/?#]+\/\d+(\.\w+)?(\?|#|$)/i.test(url);
}

// روابط منصات إطار جاهزة (يوتيوب/فيميو/فيسبوك...) — تُعرض دائمًا كإطار، بلا أي محاولة تشغيل حقيقي أولاً
function normalizeEmbedUrl(url){
  const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|live\/|embed\/)|youtu\.be\/)([\w-]+)/i);
  if (yt) return { embed:true, url:`https://www.youtube.com/embed/${yt[1]}?autoplay=1&playsinline=1` };
  const vimeo = url.match(/vimeo\.com\/(\d+)/i);
  if (vimeo) return { embed:true, url:`https://player.vimeo.com/video/${vimeo[1]}?autoplay=1` };
  if (/dailymotion\.com\/(video|embed)/i.test(url)){
    const dm = url.match(/(?:dailymotion\.com\/(?:video|embed\/video)\/)([\w]+)/i);
    if (dm) return { embed:true, url:`https://www.dailymotion.com/embed/video/${dm[1]}?autoplay=1` };
  }
  if (/drive\.google\.com\/file\/d\//i.test(url)){
    const gd = url.match(/\/file\/d\/([\w-]+)/i);
    if (gd) return { embed:true, url:`https://drive.google.com/file/d/${gd[1]}/preview` };
  }
  if (/facebook\.com\/.+\/videos\//i.test(url) || /fb\.watch\//i.test(url)){
    return { embed:true, url:`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&autoplay=1` };
  }
  if (/twitch\.tv\//i.test(url)){
    const tw = url.match(/twitch\.tv\/(?:videos\/(\d+)|([\w]+))/i);
    if (tw){
      const parent = location.hostname;
      return { embed:true, url: tw[1]
        ? `https://player.twitch.tv/?video=${tw[1]}&parent=${parent}&autoplay=true`
        : `https://player.twitch.tv/?channel=${tw[2]}&parent=${parent}&autoplay=true` };
    }
  }
  if (/ok\.ru\/(video|videoembed)/i.test(url)){
    const ok = url.match(/ok\.ru\/video(?:embed)?\/(\d+)/i);
    if (ok) return { embed:true, url:`https://ok.ru/videoembed/${ok[1]}` };
  }
  if (/rumble\.com\/embed/i.test(url)) return { embed:true, url };
  if (/\/embed\//i.test(url) && !/\.(m3u8|mp4|webm|mov|m4v|ts|mpd)(\?|#|$)/i.test(url)) return { embed:true, url };
  return { embed:false, url };
}

// محاولة تشغيل حقيقي واحدة (hls.js لبث HLS، dash.js لبث DASH، mpegts.js لبث Xtream/TS خام).
// كل دالة تُرجع Promise يُحل عند بدء التشغيل فعليًا، أو يُرفض عند فشل واضح — بلا أي تعدد بروكسيات أو لودر مخصص
function playHls(url, drmKeyIgnored, myGen){
  return new Promise((resolve, reject)=>{
    if (!(window.Hls && Hls.isSupported())){ reject(new Error('hls-unsupported')); return; }
    const v = video();
    let settled = false, mediaErrorRetries = 0;
    hlsInst = new Hls({
      enableWorker: false,
      xhrSetup: xhr => { xhr.withCredentials = false; },
      maxBufferLength: 20,
      maxMaxBufferLength: 40,
      liveSyncDurationCount: 3,
      liveMaxLatencyDurationCount: 7,
      // إعادة محاولة أقوى لأي طلب شبكة (مانيفست/مقطع) يفشل مؤقتًا (انقطاع لحظي، تحميل زائد على
      // السيرفر) بدل ما نستسلم بسرعة وننتقل لكامل سلسلة "محرك بديل/بروكسي" الثقيلة بالأعلى —
      // هذا تحديدًا سبب رئيسي من أسباب "يعلّق ثم يرجع" أو "يتقطع كل شوي" حتى لو الشبكة سليمة أغلب الوقت
      manifestLoadingMaxRetry: 4,
      manifestLoadingRetryDelay: 1000,
      manifestLoadingMaxRetryTimeout: 12000,
      levelLoadingMaxRetry: 4,
      levelLoadingRetryDelay: 1000,
      levelLoadingMaxRetryTimeout: 12000,
      fragLoadingMaxRetry: 6,
      fragLoadingRetryDelay: 1000,
      fragLoadingMaxRetryTimeout: 15000
    });
    hlsInst.loadSource(url);
    hlsInst.attachMedia(v);
    hlsInst.on(Hls.Events.MANIFEST_PARSED, ()=>{
      if (settled || loadGeneration !== myGen) return; settled = true;
      hidePlaceholder(); playReliably(v); setupQualityMenu();
      resolve();
    });
    // اكتشاف المسارات الصوتية المتعددة (عربي/إنجليزي وغيرها) يحصل عادة بعد تحميل أول جزء من البث الفعلي،
    // مو فور قراءة المانيفست فقط — لذا نحدّث قائمة الصوت لما هذا الحدث يطلع، مو مرة وحدة بس بالبداية
    hlsInst.on(Hls.Events.AUDIO_TRACKS_UPDATED, ()=>{ if (loadGeneration === myGen) setupAudioMenu(); });
    hlsInst.on(Hls.Events.ERROR, (evt, data)=>{
      if (loadGeneration !== myGen) return; // محاولة قديمة تم التخلي عنها — نتجاهل أي رد فعل متأخر منها
      if (!settled){
        if (data.fatal){ settled = true; reject(new Error('hls-fatal:'+(data.details||''))); }
        return;
      }
      // بعد بدء التشغيل بنجاح: نحاول الاسترجاع التلقائي بدل ترك الشاشة سوداء بلا تفسير
      if (data.fatal && data.type === Hls.ErrorTypes.MEDIA_ERROR){
        mediaErrorRetries++;
        if (mediaErrorRetries <= 2){ try{ hlsInst.recoverMediaError(); }catch(e){} }
        else if (hlsInst.levels && hlsInst.levels.length > 1){
          let lowestIdx = 0, lowestBitrate = Infinity;
          hlsInst.levels.forEach((lvl,idx)=>{ if (lvl.bitrate < lowestBitrate){ lowestBitrate = lvl.bitrate; lowestIdx = idx; } });
          hlsInst.currentLevel = lowestIdx;
          showToastMsg('الجودة العالية غير مدعومة على هذا الجهاز، تم التحويل لجودة أقل تلقائيًا');
          try{ hlsInst.recoverMediaError(); }catch(e){}
          mediaErrorRetries = 0;
        }
      } else if (data.fatal && data.type === Hls.ErrorTypes.NETWORK_ERROR){
        try{ hlsInst.startLoad(); }catch(e){}
      }
    });
  });
}

function playDash(url, drmKey, myGen){
  return new Promise((resolve, reject)=>{
    if (!window.dashjs){ reject(new Error('dash-unsupported')); return; }
    const v = video();
    let settled = false;
    dashInst = dashjs.MediaPlayer().create();
    dashInst.updateSettings({ streaming:{
      text:{ defaultEnabled:false },
      // إعادة محاولة أقوى عند فشل جلب المانيفست أو المقاطع مؤقتًا (شبكة بطيئة/انقطاع لحظي) بدل ما
      // dash.js يستسلم بسرعة ويطلق ERROR فادح يخلينا ننتقل لمحرك/بروكسي تاني ونفقد نقطة البث الحالية
      retryAttempts:{ MPD:4, MediaSegment:4, InitializationSegment:4, IndexSegment:4, BitstreamSwitchingSegment:4 },
      retryIntervals:{ MPD:1000, MediaSegment:1000, InitializationSegment:1000, IndexSegment:1000, BitstreamSwitchingSegment:1000 }
    } });
    // دعم مفاتيح ClearKey لبث MPD المشفّر — صيغة الحقل المتوقعة: "kid:key" أو "kid1:key1,kid2:key2"
    if (drmKey){
      try{
        const clearKeys = {};
        drmKey.split(',').forEach(pair=>{
          const [kid, key] = pair.split(':').map(x=>x && x.trim());
          if (kid && key) clearKeys[kid] = key;
        });
        if (Object.keys(clearKeys).length) dashInst.setProtectionData({ 'org.w3.clearkey': { clearkeys: clearKeys } });
      }catch(e){}
    }
    // autoplay=false هنا مقصود: نترك dash.js يجهّز البث فقط، والتشغيل الفعلي يصير عبر playReliably()
    // بالأسفل (بدء مكتوم ثم رفع الصوت) — لو تركناه true، dash.js يحاول autoplay بصوت من داخله فورًا،
    // والمتصفح (خصوصًا بمتصفح تيليجرام الداخلي بالجوال) يرفض أي تشغيل تلقائي بصوت بلا تفاعل من المستخدم،
    // فيبقى الفيديو متجمدًا لحظة قبل ما تشغيلنا المكتوم يلحقه وينجح — وهذا بالضبط سبب "يقف شوي ثم يشتغل"
    dashInst.initialize(v, url, false);
    // لا نبدّل من صورة التحميل للفيديو فور CAN_PLAY مباشرة (هذا يطلق بمجرد وجود فريم واحد فقط،
    // مو بفر كافي)، لأن هذا بالضبط سبب "يقف شوي ثم يكمل": نبان أول فريم ثم نتجمد لين يلحق التحميل.
    // بدلها ننتظر لين يتجمّع بفر حقيقي (وإحنا لسا مغطين بصورة اللودينج) ثم نبدّل دفعة وحدة بسلاسة،
    // مع مهلة قصوى (2.5 ثانية) حتى ما نعلّق لو تعذّر قياس البفر لأي سبب.
    const BUFFER_TARGET_SEC = 2.5, MAX_WAIT_MS = 2500, waitStart = Date.now();
    const tryStartPlayback = ()=>{
      if (settled || loadGeneration !== myGen) return;
      let buffered = 0;
      try{ buffered = dashInst.getBufferLength ? dashInst.getBufferLength('video') : 0; }catch(e){}
      if (buffered >= BUFFER_TARGET_SEC || (Date.now() - waitStart) >= MAX_WAIT_MS){
        settled = true; hidePlaceholder(); playReliably(v); resolve();
      } else {
        setTimeout(tryStartPlayback, 200);
      }
    };
    dashInst.on(dashjs.MediaPlayer.events.CAN_PLAY, ()=>{ if(settled || loadGeneration !== myGen) return; tryStartPlayback(); });
    dashInst.on(dashjs.MediaPlayer.events.ERROR, (e)=>{ if(settled || loadGeneration !== myGen) return; settled=true; reject(new Error('dash-fatal:'+((e&&e.error&&e.error.code)||''))); });
  });
}

function playMpegts(url, myGen){
  return new Promise((resolve, reject)=>{
    if (!(window.mpegts && mpegts.isSupported())){ reject(new Error('mpegts-unsupported')); return; }
    const v = video();
    let settled = false;
    mpegtsInst = mpegts.createPlayer({ type:'mse', isLive:true, url, hasAudio:true, hasVideo:true });
    mpegtsInst.attachMediaElement(v);
    mpegtsInst.on(mpegts.Events.ERROR, (errType, errDetail, errInfo)=>{
      if (settled || loadGeneration !== myGen) return; settled = true;
      reject(new Error('mpegts-fatal:'+errType+(errDetail?(':'+errDetail):'')+(errInfo&&errInfo.code?(':'+errInfo.code):'')));
    });
    v.addEventListener('loadeddata', ()=>{
      if (settled || loadGeneration !== myGen) return; settled = true;
      hidePlaceholder(); playReliably(v);
      resolve();
    }, { once:true });
    mpegtsInst.load();
    mpegtsInst.play();
  });
}

// محرك إضافي: تشغيل مباشر عبر عنصر <video> الأصلي بدون أي مكتبة JS للتفكيك (demux) —
// يعتمد كليًا على دعم النظام/المتصفح نفسه لفك MPEG-TS. بعض المتصفحات المدمجة (خصوصًا متصفح
// تيليجرام الداخلي على iOS المبني على Safari/AVPlayer) تدعم هذا فعلًا حتى بدون امتداد m3u8،
// بعكس Chrome على سطح المكتب. تكلفته صفر (لا تنزيل مكتبة، لا فك تشفير بجافاسكربت) فنجربه
// كمحاولة سريعة إضافية على روابط Xtream الخام قبل اللجوء لـ mpegts.js الأثقل.
function playNative(url, myGen){
  return new Promise((resolve, reject)=>{
    const v = video();
    let settled = false;
    const onOk = ()=>{
      if (settled || loadGeneration !== myGen) return; settled = true;
      v.removeEventListener('error', onErr);
      hidePlaceholder(); playReliably(v);
      resolve();
    };
    const onErr = ()=>{
      if (settled || loadGeneration !== myGen) return; settled = true;
      v.removeEventListener('loadeddata', onOk);
      const code = v.error && v.error.code;
      reject(new Error('native-fatal'+(code?(':'+code):'')));
    };
    v.addEventListener('loadeddata', onOk, { once:true });
    v.addEventListener('error', onErr, { once:true });
    try{
      v.src = url;
      v.load();
      v.play().catch(()=>{}); // بعض المتصفحات ترفض play() قبل استعداد البيانات — نتجاهلها، loadeddata/error تكفي للحكم
    }catch(e){ if (!settled){ settled = true; reject(e); } }
  });
}

let shakaInst = null;
async function playShaka(url, drmKey, myGen){
  if (!window.shaka) await waitForLib('shaka', 6000);
  if (!window.shaka){ throw new Error('shaka-unsupported'); }
  try{ shaka.polyfill.installAll(); }catch(e){}
  if (!(shaka.Player && shaka.Player.isBrowserSupported && shaka.Player.isBrowserSupported())){
    throw new Error('shaka-unsupported');
  }
  const v = video();
  try{ if (shakaInst) await shakaInst.destroy(); }catch(e){}
  if (loadGeneration !== myGen) throw new Error('superseded'); // محاولة قديمة تم التخلي عنها أثناء الانتظار
  shakaInst = new shaka.Player();
  await shakaInst.attach(v);
  // إعادة محاولة أقوى (مانيفست ومقاطع) عند فشل مؤقت، + أهداف بفر أوضح — نفس فكرة تقوية hls.js/dash.js
  // أعلاه، عشان أي انقطاع شبكة لحظي (خصوصًا بروكسي/سيرفرات Xtream/IPTV غير المستقرة) ما يوصل لخطأ
  // فادح يوقف التشغيل، بل يعيد المحاولة بهدوء بالخلفية والمشاهد يكمل يتفرج بلا ملاحظة انقطاع
  try{
    shakaInst.configure({
      streaming:{
        retryParameters:{ maxAttempts:5, baseDelay:1000, backoffFactor:2, fuzzFactor:0.5, timeout:0 },
        bufferingGoal: 20,
        rebufferingGoal: 4,
        bufferBehind: 30
      },
      manifest:{
        retryParameters:{ maxAttempts:5, baseDelay:1000, backoffFactor:2, fuzzFactor:0.5, timeout:0 }
      }
    });
  }catch(e){}
  // دعم مفاتيح ClearKey لبث MPD المشفّر — نفس صيغة الحقل المستخدمة مع dash.js: "kid:key" أو عدة أزواج بفاصلة
  if (drmKey){
    try{
      const clearKeys = {};
      drmKey.split(',').forEach(pair=>{
        const [kid, key] = pair.split(':').map(x=>x && x.trim());
        if (kid && key) clearKeys[kid] = key;
      });
      if (Object.keys(clearKeys).length) shakaInst.configure({ drm:{ clearKeys } });
    }catch(e){}
  }
  await shakaInst.load(url);
  if (loadGeneration !== myGen) return; // محاولة قديمة تم التخلي عنها أثناء التحميل
  hidePlaceholder(); playReliably(v);
  setupQualityMenu();
}

function timeoutAfter(ms){ return new Promise(resolve=>setTimeout(()=>resolve('timeout'), ms)); }

let loadGeneration = 0;
// روابط Xtream Codes (الأغلبية الساحقة من السيرفرات) بها نفس البث بصيغتين على نفس المسار: TS خام
// (اللي يحتاج تحويل حي بالمتصفح عبر mpegts.js — أثقل وأقل استقرارًا)، وبديل m3u8 حقيقي على نفس الرابط
// بالضبط بس بامتداد مختلف (يشغّله hls.js مباشرة، وهو أنضج وأثبت بكثير من mpegts.js لأي بث حي).
// هذا التخمين يشتغل مع الغالبية العظمى من باقات Xtream، فنجربه أولًا قبل اللجوء لـ mpegts.js الأثقل.
function deriveXtreamM3u8(url){
  try{
    const u = new URL(url);
    u.pathname = u.pathname.replace(/\.\w+$/, '') + '.m3u8';
    return u.toString();
  }catch(e){ return null; }
}

async function loadSource(url, source){
  const myGen = ++loadGeneration; // كل نداء جديد يبطل أي محاولة سابقة لسه شغالة بالخلفية
  lastUrl = url; // الرابط الأصلي دائمًا (لإعادة المحاولة، وللتحقق من عدم تغييره أثناء التشغيل)
  lastSource = source || null;
  state.currentSource = source || null;
  // نخفي مؤشر LIVE/شارة "مباشر" من المصدر السابق فورًا هنا فقط (مرة واحدة، قبل ما نحدد نوع المصدر
  // الجديد بـapplyTypeUI تحت) — resetPlayerUI() ما تلمس currentIsLive أبدًا لأنها تُستدعى أيضًا بين
  // محاولات إعادة الاتصال لنفس المصدر (بروكسي/شاكا...)، ولو كانت تصفّرها بكل مرة كان الوميض
  // يختفي للأبد بمجرد ما يحتاج المصدر أكثر من محاولة وحدة (شائع جدًا مع MPD)
  currentIsLive = false; liveIndicatorReady = false; baselineDelay = null; clearTimeout(baselineTimer); updateLiveIndicator();
  document.getElementById('liveBadgeP').style.display = 'none';
  await resetPlayerUI();

  if (!url){ showPlaceholder('تعذر تشغيل هذا الرابط', true); return; }

  // دعم لصق كود iframe كامل (بدل رابط مباشر) — يستخرج src ويعرضه كإطار مباشرة
  if (/<iframe[\s>]/i.test(url)){
    const m = url.match(/src=["']([^"']+)["']/i);
    if (m && m[1]){ showEmbed(m[1].startsWith('http') ? m[1] : ('https:'+m[1])); setupQualityMenu(); return; }
  }

  const rawUrl = url.trim();

  const m = state.currentMatch;
  video().poster = (m && m.thumbnail_url) || '';

  const forcedType = source && source.stream_type && source.stream_type !== 'auto' ? source.stream_type : null;
  const bestGuess = forcedType || detectTypeFromExtension(rawUrl) || (m && m.type) || 'vod';
  applyTypeUI(bestGuess);

  // منصات إطار معروفة (يوتيوب/فيميو/فيسبوك...) — تُعرض كإطار دائمًا، بلا أي محاولة تشغيل حقيقي
  const norm = normalizeEmbedUrl(rawUrl);
  if (norm.embed){ showEmbed(norm.url); setupQualityMenu(); return; }

  bindVideoEvents();
  setupQualityMenu();

  const drmKey = (source && source.drm_key) ? String(source.drm_key).trim() : null;
  const playUrl = playableUrl(rawUrl); // يمر بالبروكسي فقط لو http غير مشفّر (القيد الوحيد الحقيقي)

  function makeAttempt(engine, url){
    if (engine === 'mpegts') return playMpegts(url, myGen);
    if (engine === 'dash') return playDash(url, drmKey, myGen);
    return playHls(url, null, myGen);
  }

  let primaryEngine;
  const isM3u8 = /\.m3u8?(\?|#|$)/i.test(rawUrl); // امتداد صريح m3u8 = ملف تشغيل HLS فعلي، له الأولوية دائمًا
  if (/\.mpd(\?|#|$)/i.test(rawUrl)){
    primaryEngine = 'dash';
  } else if (isM3u8){
    primaryEngine = 'hls'; // HLS حقيقي — hls.js (ثم Shaka لاحقًا لو فشلت) هي الصح له، مو mpegts.js
  } else if (/\.ts(\?|#|$)/i.test(rawUrl) || isXtreamLiveUrl(rawUrl)){
    primaryEngine = 'mpegts'; // بث خام حقيقي بلا امتداد m3u8 — هذا النوع يحتاج mpegts.js فعلاً (إلا لو نجح تخمين m3u8 تحت)
  } else {
    primaryEngine = 'hls';
  }
  // نحفظ هذا قبل ما primaryEngine يتغيّر لاحقًا (لو نجح تخمين m3u8 أو Native) — يحدد أي بروكسي نستخدم
  // بمرحلة الفشل تحت: Xtream يروح لبروكسي سوبابيس (IP غير محظور)، وأي شيء ثاني يفضل على Cloudflare.
  const isXtreamSource = (primaryEngine === 'mpegts');
  const PROXY_BASE = isXtreamSource ? XTREAM_STREAM_PROXY : STREAM_PROXY;

  function raceAttempt(promiseFn, onErr){
    let err = null;
    return Promise.race([
      promiseFn.then(()=>'ok').catch(e=>{ err = e; return 'fail'; }),
      timeoutAfter(7000).then(r=>{ if(!err) err = new Error('انتهت المهلة (7 ثوانٍ) بلا رد'); return r; })
    ]).then(r=>{ if (onErr) onErr(err); return r; });
  }

  let err1 = null;
  let result;

  // محاولة إضافية سريعة قبل أي شيء: لو الرابط يبدو بث Xtream حي بدون امتداد m3u8 صريح، نجرب أول شيء
  // بديل m3u8 بنفس المسار عبر hls.js (أثبت بكثير من mpegts.js لأي بث حي). لو نجح نوفر على المستخدم
  // كل سلسلة المحاولات الثقيلة اللي تحت. لو فشل، نكمل بالتدفق العادي (mpegts.js على الرابط الخام)
  // بالضبط بدون أي تغيير، ونسجل خطأها فقط للعرض النهائي لو انتهى بنا المطاف لفشل الكل.
  if (primaryEngine === 'mpegts'){
    const guessedM3u8 = deriveXtreamM3u8(rawUrl);
    if (guessedM3u8 && guessedM3u8 !== rawUrl){
      const guessedPlayable = /^http:\/\//i.test(guessedM3u8) ? `${XTREAM_STREAM_PROXY}?url=${encodeURIComponent(guessedM3u8)}` : guessedM3u8;
      result = await raceAttempt(playHls(guessedPlayable, null, myGen), e=>err1=e);
      if (loadGeneration !== myGen) return;
      if (result === 'ok') primaryEngine = 'hls'; // نجحت — نعتبرها المحرك الفعلي من هنا فصاعدًا
      else { await resetPlayerUI(); err1 = null; }
    }
    // محاولة إضافية بمحرك التشغيل الأصلي (Native) قبل mpegts.js: تكلفتها صفر (بلا تحميل مكتبة ولا
    // فك تشفير جافاسكربت)، وأحيانًا تنجح بمتصفحات داخلية (مثل متصفح تيليجرام على iOS) حتى مع
    // روابط Xtream الخام اللي تفشل معها مكتبات JS. لو فشلت، نكمل بالتدفق العادي (mpegts.js) بلا تغيير.
    if (result !== 'ok'){
      let errNative = null;
      await resetPlayerUI();
      result = await raceAttempt(playNative(playUrl, myGen), e=>errNative=e);
      if (loadGeneration !== myGen) return;
      if (result === 'ok') primaryEngine = 'native';
      else { await resetPlayerUI(); err1 = err1 || errNative; }
    }
  }

  if (result !== 'ok'){
    result = await raceAttempt(makeAttempt(primaryEngine, playUrl), e=>err1=e);
    if (loadGeneration !== myGen) return; // المستخدم غيّر المصدر أثناء المحاولة — نتوقف بصمت
  }

  // فشل المحاولة الأولى (المباشرة) بأي محرك (hls/dash/mpegts) — نعيد نفس المحرك بالضبط لكن عبر بروكسي
  // بدل الاتصال المباشر، قبل ما نستسلم أو ننتقل لمحرك ثاني. Xtream يستخدم بروكسي سوبابيس (نطاق IP
  // Cloudflare محظور عند بعض لوحات Xtream ويرجع 403 دائمًا)، وأي رابط ثاني يفضل على بروكسي Cloudflare.
  // البروكسي يدعم أكثر من "هوية" (User-Agent) يبعثها لسيرفر البث بدلًا عن هوية المتصفح: بعض سيرفرات
  // Xtream/IPTV ترفض طلبات المتصفح مباشرة (403/CORS) بس تسمح بهويات تطبيقات تشغيل معروفة. نجرب
  // الهوية الافتراضية (okhttp) أولًا، وإذا فشلت نجرب هوية MX Player تحديدًا.
  const proxiedUrl = `${PROXY_BASE}?url=${encodeURIComponent(rawUrl)}`;
  const proxiedUrlMx = `${PROXY_BASE}?url=${encodeURIComponent(rawUrl)}&ua=mx`;
  if (result !== 'ok' && !playUrl.startsWith(STREAM_PROXY) && !playUrl.startsWith(XTREAM_STREAM_PROXY)){
    await resetPlayerUI();
    result = await raceAttempt(makeAttempt(primaryEngine, proxiedUrl), e=>err1=e);
    if (loadGeneration !== myGen) return;
    if (result !== 'ok'){
      await resetPlayerUI();
      result = await raceAttempt(makeAttempt(primaryEngine, proxiedUrlMx), e=>err1=e);
      if (loadGeneration !== myGen) return;
    }
  }

  // لو المحرك الأساسي كان hls.js أو dash.js وفشل (مباشر وعبر البروكسي بهويتيه)، نجرب Shaka Player كبديل
  // قبل ما نستسلم (نتجاهل هذي الخطوة فقط لو كان المحرك الأساسي mpegts.js أصلاً — Shaka ما يدعم MPEG-TS
  // الخام). نجرب Shaka مباشر، ثم عبر البروكسي بهويته الافتراضية، ثم عبر البروكسي بهوية MX Player.
  let err2 = null;
  if (result !== 'ok' && primaryEngine !== 'mpegts'){
    await resetPlayerUI();
    result = await raceAttempt(playShaka(playUrl, drmKey, myGen), e=>err2=e);
    if (loadGeneration !== myGen) return;
    if (result !== 'ok' && !playUrl.startsWith(STREAM_PROXY)){
      await resetPlayerUI();
      result = await raceAttempt(playShaka(proxiedUrl, drmKey, myGen), e=>err2=e);
      if (loadGeneration !== myGen) return;
      if (result !== 'ok'){
        await resetPlayerUI();
        result = await raceAttempt(playShaka(proxiedUrlMx, drmKey, myGen), e=>err2=e);
        if (loadGeneration !== myGen) return;
      }
    }
  }

  if (result !== 'ok'){
    // كل المحاولات الحقيقية فشلت — نعرض رسالة واضحة توضح السبب بدل اللجوء الصامت لـ iframe
    const parts = [`${primaryEngine}: ${err1 ? err1.message : '؟'}`];
    if (err2) parts.push(`shaka: ${err2.message}`);
    showPlaceholder('تعذر تشغيل هذا الرابط — ' + parts.join(' | '), true);
  }
}
// حارس "العودة للحظة البث المباشر": لو تعلّق التشغيل (buffering) أو تجمّد بلا سبب واضح (بما فيها الوقفة
// القصيرة الطبيعية بعد تغيير الجودة/الصوت)، نقفز لأحدث نقطة متاحة ونجبر التشغيل يكمل — بدل ما يبقى
// عالقًا صامتًا عند آخر نقطة توقف فيها. دالة عامة يستخدمها حارس التعليق العادي، وحارس رجوع الصفحة
// من الخلفية، وأيضًا مباشرة بعد أي تبديل جودة/صوت يدوي (بدل انتظار الحراس الدورية البطيئة)
function resyncLiveEdge(forcePlay){
  if (!currentIsLive) return;
  const v = video();

  // تقدير حافة البث من المحرك (سقف أعلى لا نتجاوزه، مو بالضرورة الهدف النهائي)
  let engineEdge = null;
  if (hlsInst && isFinite(hlsInst.liveSyncPosition)){
    engineEdge = hlsInst.liveSyncPosition;
  } else if (shakaInst && shakaInst.seekRange){
    try{ const r = shakaInst.seekRange(); if (r && isFinite(r.end)) engineEdge = r.end; }catch(e){}
  }

  // الأهم: نفضّل القفز لنقطة داخل النطاق المُحمَّل فعليًا حاليًا بالفيديو (v.buffered) — هذا يضمن
  // استمرار التشغيل فورًا بلا أي حاجة لجلب بيانات جديدة من الشبكة. القفز لنقطة "نظرية" على حافة
  // البث (حتى لو محسوبة صح من المحرك) ممكن تكون خارج المُحمَّل فعليًا، فتحتاج تحميل جديد ويصير
  // القفز نفسه سبب تعليق إضافي بدل حل — بالضبط الحالة اللي وُصفت
  let bufferedTarget = null;
  try{
    const b = v.buffered;
    if (b && b.length){
      const end = b.end(b.length - 1);
      bufferedTarget = Math.max(0, end - 0.4); // أقرب ما يمكن لآخر فريم محمّل فعليًا — المستخدم يريد عرضه فورًا لا انتظار فريم جديد
    }
  }catch(e){}

  let target = null;
  if (bufferedTarget !== null && engineEdge !== null) target = Math.min(bufferedTarget, engineEdge);
  else target = (bufferedTarget !== null) ? bufferedTarget : engineEdge;

  if (target === null){
    try{
      if (v.seekable && v.seekable.length){
        const end = v.seekable.end(v.seekable.length - 1);
        if (isFinite(end)) target = end - 1;
      }
    }catch(e){}
  }
  if (target !== null && target - v.currentTime > 6){
    try{ v.currentTime = Math.max(0, target); }catch(e){}
    scheduleBaselineCapture(); // نقطة التشغيل تغيّرت — نعيد قياس "التأخر الطبيعي" من جديد بعد الاستقرار
  }
  if (forcePlay) playReliably(v);
}
// ===== مؤشر LIVE بالأزرار: يفحص كل ثانية مقدار التأخر عن اللحظة الحية الفعلية —
// أحمر ووامض إذا كان قريب من الحافة الحية، رمادي وثابت إذا تأخر لأي سبب (تخزين مؤقت، تعليق قصير...).
// نستخدم API الحقيقي لكل محرك بدل حساب يدوي واحد للجميع:
// - dash.js: getCurrentLiveLatency() تعطي التأخر الفعلي المُدار من المشغل نفسه (أدق بكثير من
//   حساب seekable يدويًا، لأن dash.js يستهدف تأخرًا معينًا مقصودًا حسب المانفست، وحسابنا اليدوي
//   كان يعتبره دائمًا "متأخر" حتى لو كان طبيعيًا تمامًا — وهذا سبب اختفاء الوميض بالداش)
// - غير ذلك (hls.js/mpegts/native): نحسبها من seekable.end() - currentTime كالمعتاد
// + هيستريريسس (عتبتين مختلفتين للدخول/الخروج من حالة التأخر) عشان اللون ما يرجرج عشوائيًا لما
// يكون التأخر قريب من الحد الفاصل
let liveIndicatorDelayed = false;
// قياس "التأخر الخام" عن نقطة المزامنة المقصودة لكل محرك — بلا أي معايرة، رقم فوري فقط
function measureLiveDelay(v){
  let delay = 0, got = false;
  try{
    if (dashInst && dashInst.getCurrentLiveLatency){
      const lat = dashInst.getCurrentLiveLatency();
      if (isFinite(lat) && lat >= 0){ delay = lat; got = true; }
    }
  }catch(e){}
  if (!got && hlsInst){
    try{
      const syncPos = hlsInst.liveSyncPosition;
      if (isFinite(syncPos)){ delay = Math.max(0, syncPos - v.currentTime); got = true; }
    }catch(e){}
  }
  if (!got && shakaInst && shakaInst.getStats){
    try{
      const stats = shakaInst.getStats();
      if (stats && isFinite(stats.liveLatency) && stats.liveLatency >= 0){ delay = stats.liveLatency; got = true; }
    }catch(e){}
  }
  if (!got){
    try{
      if (v.seekable && v.seekable.length){
        const liveEdge = v.seekable.end(v.seekable.length - 1);
        if (isFinite(liveEdge)) delay = Math.max(0, liveEdge - v.currentTime);
      }
    }catch(e){}
  }
  return delay;
}
// التأخر "الخام" مختلف جوهريًا بين الصيغ: MPD (خصوصًا عبر شاكا) عادةً يشتغل عمدًا بعيد عن الحافة
// بعشرات الثواني حسب المانفست (suggestedPresentationDelay) — وهذا تصميم طبيعي للصيغة، مو مشكلة،
// وما يتغير مع الوقت لأن التشغيل يمشي بنفس سرعة البث الحقيقي (1x) فيبقى بنفس المسافة تقريبًا للأبد.
// فحساب "متأخر" من رقم ثابت زي 7 ثوانٍ كان يجعل MPD يبقى "متأخر" للأبد حتى بدون أي مشكلة حقيقية.
// الحل: نلتقط هذا التأخر الطبيعي مرة وحدة كـ"أساس" (baseline) بعد ما يستقر البث فعليًا، ونحكم بعدها
// على "الفرق الإضافي" عنه فقط — أي تأخر زيادة حقيقي (تعليق فعلي) يُكتشف، والتأخر التصميمي الطبيعي يُتجاهل
let baselineDelay = null;
let baselineTimer = null;
function scheduleBaselineCapture(){
  clearTimeout(baselineTimer);
  baselineTimer = setTimeout(()=>{
    if (!currentIsLive || !liveIndicatorReady) return;
    baselineDelay = measureLiveDelay(video());
  }, 4000); // 4 ثوانٍ بعد الاستقرار كافية عادة لقراءة تمثّل الوضع الطبيعي، بعيدًا عن رجّة البداية
}
function updateLiveIndicator(){
  const el = document.getElementById('btnLiveIndicator');
  if (!el) return;
  if (!currentIsLive || !liveIndicatorReady){ el.classList.add('hide'); return; }
  el.classList.remove('hide');
  const v = video();
  const rawDelay = measureLiveDelay(v);
  const delay = Math.max(0, rawDelay - (baselineDelay || 0)); // الفرق فوق التأخر الطبيعي فقط
  // عتبة دخول أعلى من عتبة خروج (7 / 3) تمنع الرجرجة العشوائية قرب نقطة التحول
  if (liveIndicatorDelayed){ if (delay <= 3) liveIndicatorDelayed = false; }
  else { if (delay > 7) liveIndicatorDelayed = true; }
  el.classList.toggle('at-edge', !liveIndicatorDelayed);
  el.classList.toggle('delayed', liveIndicatorDelayed);
}
setInterval(updateLiveIndicator, 1000);
// نسخة خفيفة تُستخدم بعد تبديل جودة/صوت سلس (nextLevel بـhls.js أو fastSwitchEnabled:false بـdash.js):
// هذي الطرق مصممة أصلًا عشان البث يكمل بلا أي توقف حقيقي، فلا داعي لفحص/قفز resyncLiveEdge بعدها —
// استخدام resyncLiveEdge هنا كان هو نفسه سبب إلغاء سلاسة التبديل (يفرض قفز فوري لو readyState هبط
// للحظة وحدة أثناء التبديل، حتى لو ما فيه توقف فعلي)
function afterSmoothQualitySwitch(){ playReliably(video()); }
// يُستدعى فور أي تبديل جودة/صوت داخل نفس البث (بلا إعادة تحميل كاملة): فحص سريع مرتين خلال أول
// ثانيتين بدل انتظار حارس التعليق العام (6 ثوانٍ) — يخلي أي وقفة قصيرة أثناء التبديل تنتهي بسرعة
// بدل الشعور إن البث "توقف وما رجع"
function nudgeAfterSwitch(){
  const v = video();
  playReliably(v);
  setTimeout(()=>{ if (v.paused || v.readyState < 3) resyncLiveEdge(true); }, 1200);
  setTimeout(()=>{ if (v.paused || v.readyState < 3) resyncLiveEdge(true); }, 2500);
}
function bindVideoEvents(){
  if (boundOnce) return; boundOnce=true;
  const v = video();
  // تعطيل مضاعف لقائمة أندرويد/كروم الأصلية (Cast/PiP/تنزيل) اللي تظهر عند الضغط المطوّل على الفيديو —
  // خاصية HTML وحدها (disablepictureinpicture/controlslist) ما تكفي بكل نسخ المتصفحات، فنطبقها JS كمان
  try{ v.disablePictureInPicture = true; }catch(e){}
  try{ v.disableRemotePlayback = true; }catch(e){}
  v.addEventListener('contextmenu', e=>e.preventDefault());
  document.getElementById('playerWrap').addEventListener('contextmenu', e=>e.preventDefault());
  v.addEventListener('play', ()=>{ isPlayingState=true; updatePlayIcons(true); showCtrl(); });
  v.addEventListener('pause', ()=>{ isPlayingState=false; updatePlayIcons(false); });
  v.addEventListener('timeupdate', ()=>{
    if (!v.duration) return;
    const pct = (v.currentTime/v.duration)*100;
    document.getElementById('seekBar').value = pct;
    document.getElementById('timeCur').textContent = fmtSec(v.currentTime);
    document.getElementById('timeDur').textContent = fmtSec(v.duration);
  });
  v.addEventListener('webkitendfullscreen', ()=>{
    if (isFull){
      isFull = false;
      document.getElementById('playerWrap').classList.remove('fs');
      document.body.classList.remove('fs-lock');
    }
  });

  // بناءً على طلب صريح: ما فيه أي تدخل تلقائي (قفز/إعادة تحميل) عند التعليق. زر LIVE وظيفته معلوماتية
  // بحتة (يعرض هل البث بالحافة الحية أو متأخر) + الضغط اليدوي فقط يرجّع للحظة المباشرة عند الحاجة.
  // كان فيه سابقًا حارس تلقائي (soft recovery + hard resync) على حدث 'waiting'، لكنه كان يتفعّل حتى
  // أثناء التحميل الأولي قبل ما يبدأ العرض أصلاً (البث لسا يبني البفر الأول)، فيقفز فوق العملية
  // الطبيعية ويسبب حلقة "يجيب فريم ثم يعلّق ثم يرجع يجيب من الصفر" — وهذا بالضبط اللي لوحظ. حُذف بالكامل.
  v.addEventListener('playing', ()=>{ liveIndicatorReady = true; scheduleBaselineCapture(); updateLiveIndicator(); });

  // (حُذف: كان فيه هنا قفز تلقائي للحظة المباشرة عند رجوع الصفحة من الخلفية/التصغير. امتثالًا للطلب
  // الصريح، ما فيه أي قفز تلقائي إطلاقًا — الزر اليدوي فقط هو من يحرّك نقطة التشغيل)

  // حارس دوري تلقائي محذوف بالكامل بناءً على نفس الطلب أعلاه — كان يقفز تلقائيًا لو الوقت ما يتقدم
  // رغم إن الفيديو "يشتغل"، والزر اليدوي كافي وحده للعودة للمباشر عند الحاجة.
}
function fmtSec(s){ if(!s||isNaN(s)) return '0:00'; const m=Math.floor(s/60), ss=Math.floor(s%60); return m+':'+(ss<10?'0':'')+ss; }
function updatePlayIcons(playing){
  const path = playing
    ? 'M6 19h4V5H6v14zm8-14v14h4V5h-4z'
    : 'M8 5v14l11-7z';
  document.querySelectorAll('#btnCenterPlay svg path, #btnBarPlay svg path').forEach(p=>p.setAttribute('d',path));
}
function togglePlay(){
  const v = video();
  if (document.getElementById('embedFrame')) return;
  if (v.paused) playReliably(v); else v.pause();
  showCtrl();
}
function toggleMute(){
  const v = video();
  isMuted = !isMuted; v.muted = isMuted;
  const path = isMuted
    ? 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z'
    : 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z';
  document.querySelector('#btnMute svg path').setAttribute('d', path);
}
function seekBy(sec){
  const v = video(); if (!v.duration) return;
  v.currentTime = Math.max(0, Math.min(v.duration, v.currentTime+sec));
  showCtrl();
}
function onSeekInput(val){
  const v = video(); if (!v.duration) return;
  v.currentTime = (val/100)*v.duration;
}
function showCtrl(){
  const w = document.getElementById('playerWrap');
  w.classList.add('show');
  clearTimeout(ctrlTimer);
  ctrlTimer = setTimeout(()=>w.classList.remove('show'), 3200);
}
let lastTap=0;
function onPlayerTap(e){
  const now = Date.now();
  const w = document.getElementById('playerWrap');
  if (now-lastTap < 300){ lastTap=0; return; } // منع تكرار مع أزرار التخطي
  lastTap = now;
  if (w.classList.contains('show')){ clearTimeout(ctrlTimer); w.classList.remove('show'); }
  else showCtrl();
}
function setupQualityMenu(){
  const btn = document.getElementById('btnQuality');
  const menu = document.getElementById('qualityMenu');
  setupAudioMenu(); // مستقلة تمامًا عن منطق الجودة — نستدعيها هنا دائمًا بدل الاعتماد على نهاية هذي الدالة

  // 1) جودات يدوية أضافها الأدمن لهذا السيرفر تحديدًا (روابط بديلة كاملة)
  const src = state.currentSource;
  const manualQ = (src && Array.isArray(src.qualities)) ? src.qualities.filter(q=>q && q.url) : [];
  if (manualQ.length){
    btn.classList.remove('hide');
    const activeUrl = lastUrl;
    const items = [`<div data-mq="-1" class="${src.url===activeUrl?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${src.url===activeUrl?'✓ ':''}الجودة الأساسية</div>`]
      .concat(manualQ.map((q,i)=>`<div data-mq="${i}" class="${q.url===activeUrl?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${q.url===activeUrl?'✓ ':''}${escapeHtml(q.label||('جودة '+(i+1)))}</div>`));
    menu.innerHTML = items.join('<div style="height:1px;background:var(--border)"></div>');
    menu.querySelectorAll('[data-mq]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        menu.classList.add('hide');
        const idx = parseInt(el.dataset.mq);
        const targetUrl = idx===-1 ? src.url : manualQ[idx].url;
        if (targetUrl && targetUrl !== activeUrl) loadSource(targetUrl, src);
      };
    });
    return;
  }

  // 2) احتياطًا: جودات المحرك المستخدم فعليًا تلقائيًا (hls.js / dash.js / Shaka)
  if (hlsInst && hlsInst.levels && hlsInst.levels.length >= 2){
    btn.classList.remove('hide');
    // نأخذ أعلى بتريت لكل دقة فقط (بعض الروابط فيها أكثر من نسخة بنفس الدقة ببتريت مختلف، يطلع مكرر بصريًا)
    const byHeight = new Map();
    hlsInst.levels.forEach((lvl,i)=>{
      const key = lvl.height || lvl.bitrate;
      if (!byHeight.has(key) || byHeight.get(key).lvl.bitrate < lvl.bitrate) byHeight.set(key, {lvl, i});
    });
    const uniq = [...byHeight.values()].sort((a,b)=>b.lvl.height-a.lvl.height);
    // نحدد الخيار النشط حاليًا: -1 (تلقائي) لو ABR شغال، أو رقم المستوى المثبّت يدويًا لو المستخدم اختار جودة معينة سابقًا
    const activeLevel = hlsInst.autoLevelEnabled ? -1 : hlsInst.currentLevel;
    const items = [`<div data-l="-1" class="${activeLevel===-1?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${activeLevel===-1?'✓ ':''}تلقائي</div>`]
      .concat(uniq.map(({lvl,i})=>`<div data-l="${i}" class="${activeLevel===i?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${activeLevel===i?'✓ ':''}${lvl.height?lvl.height+'p':Math.round(lvl.bitrate/1000)+'kbps'}</div>`));
    menu.innerHTML = items.join('<div style="height:1px;background:var(--border)"></div>');
    menu.querySelectorAll('[data-l]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        // nextLevel بدل currentLevel: يخلي البث يكمل عرض الجودة الحالية من نفس نقطتها إلى أن تجهز
        // الجودة الجديدة، بدل تفريغ المخزّن المؤقت فورًا (وهو سبب توقف البث أحيانًا عند تغيير الجودة)
        hlsInst.nextLevel = parseInt(el.dataset.l);
        // تعليم فوري للخيار المختار بالأحمر (بدون انتظار إعادة بناء القائمة)
        menu.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('menu-active', x===el));
        menu.classList.add('hide');
        afterSmoothQualitySwitch();
      };
    });
    return;
  }

  if (dashInst && dashInst.getBitrateInfoListFor){
    const rawList = dashInst.getBitrateInfoListFor('video') || [];
    // نفس منطق التصفية المستخدم مع hls.js: أعلى بتريت فقط لكل دقة، مرتبة تنازليًا، لتفادي التكرار البصري
    const byH = new Map();
    rawList.forEach(l=>{ const key = l.height || l.bitrate; if (!byH.has(key) || byH.get(key).bitrate < l.bitrate) byH.set(key, l); });
    const list = [...byH.values()].sort((a,b)=>(b.height||0)-(a.height||0));
    if (list.length >= 2){
      btn.classList.remove('hide');
      let autoOn = true; try{ autoOn = !!dashInst.getSettings().streaming.abr.autoSwitchBitrate.video; }catch(e){}
      let curIdx = -1; try{ curIdx = dashInst.getQualityFor('video'); }catch(e){}
      const activeIdx = autoOn ? -1 : curIdx;
      const items = [`<div data-dq="-1" class="${activeIdx===-1?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${activeIdx===-1?'✓ ':''}تلقائي</div>`]
        .concat(list.map(l=>`<div data-dq="${l.qualityIndex}" class="${activeIdx===l.qualityIndex?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${activeIdx===l.qualityIndex?'✓ ':''}${l.height?l.height+'p':Math.round(l.bitrate/1000)+'kbps'}</div>`));
      menu.innerHTML = items.join('<div style="height:1px;background:var(--border)"></div>');
      menu.querySelectorAll('[data-dq]').forEach(el=>{
        el.onclick = (e)=>{
          e.stopPropagation();
          const idx = parseInt(el.dataset.dq);
          // fastSwitchEnabled:false يخلي dash.js يبدّل الجودة بالمقاطع القادمة فقط بدون تفريغ
          // المخزّن المؤقت الحالي فورًا — نفس فكرة nextLevel بـ hls.js: يكمل البث بالجودة الحالية
          // إلى أن تجهز الجديدة بدل ما يتوقف
          dashInst.updateSettings({ streaming:{ buffer:{ fastSwitchEnabled:false }, abr:{ autoSwitchBitrate:{ video: idx===-1 } } } });
          if (idx !== -1) dashInst.setQualityFor('video', idx);
          // تعليم فوري للخيار المختار بالأحمر
          menu.querySelectorAll('[data-dq]').forEach(x=>x.classList.toggle('menu-active', x===el));
          menu.classList.add('hide');
          afterSmoothQualitySwitch();
        };
      });
      return;
    }
  }

  if (shakaInst && shakaInst.getVariantTracks){
    const rawTracks = (shakaInst.getVariantTracks() || []).filter(t=>t.height || t.bandwidth);
    const byHt = new Map();
    rawTracks.forEach(t=>{ const key = t.height || t.bandwidth; if (!byHt.has(key) || byHt.get(key).bandwidth < t.bandwidth) byHt.set(key, t); });
    const tracks = [...byHt.values()].sort((a,b)=>(b.height||0)-(a.height||0));
    if (tracks.length >= 2){
      btn.classList.remove('hide');
      const shakaAutoOn = (function(){ try{ return shakaInst.getConfiguration().abr.enabled; }catch(e){ return true; } })();
      const items = [`<div data-sq="-1" class="${shakaAutoOn?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${shakaAutoOn?'✓ ':''}تلقائي</div>`]
        .concat(tracks.map(t=>`<div data-sq="${t.id}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${t.height?t.height+'p':Math.round(t.bandwidth/1000)+'kbps'}</div>`));
      menu.innerHTML = items.join('<div style="height:1px;background:var(--border)"></div>');
      menu.querySelectorAll('[data-sq]').forEach(el=>{
        el.onclick = (e)=>{
          e.stopPropagation();
          const id = parseInt(el.dataset.sq);
          if (id === -1){ shakaInst.configure('abr.enabled', true); }
          else{
            shakaInst.configure('abr.enabled', false);
            const t = tracks.find(t=>t.id===id);
            // clearBuffer=false (بدل true): يخلي شاكا يكمل تشغيل الجودة الحالية من نفس نقطتها بلا أي
            // قطع، ويجهّز الجودة الجديدة بالكامل بالخلفية، ثم يبدّل لها تلقائيًا بمجرد جاهزيتها —
            // بالضبط نفس سلوك nextLevel بـhls.js وfastSwitchEnabled:false بـdash.js أعلاه
            if (t) shakaInst.selectVariantTrack(t, /*clearBuffer*/ false);
          }
          // تعليم الخيار المختار فورًا باللون الأحمر بدل انتظار إعادة بناء القائمة بالكامل
          menu.querySelectorAll('[data-sq]').forEach(x=>x.classList.toggle('menu-active', x===el));
          menu.classList.add('hide');
          afterSmoothQualitySwitch();
        };
      });
      return;
    }
  }

  btn.classList.add('hide');
}

function setupAudioMenu(){
  const btn = document.getElementById('btnAudio');
  const menu = document.getElementById('audioMenu');
  if (!btn || !menu) return;

  if (hlsInst && hlsInst.audioTracks && hlsInst.audioTracks.length >= 2){
    btn.classList.remove('hide');
    const items = hlsInst.audioTracks.map((t,i)=>`<div data-at="${i}" class="${i===hlsInst.audioTrack?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${i===hlsInst.audioTrack?'✓ ':''}${escapeHtml(t.name||t.lang||('مسار '+(i+1)))}</div>`);
    menu.innerHTML = items.join('<div style="height:1px;background:var(--border)"></div>');
    menu.querySelectorAll('[data-at]').forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); hlsInst.audioTrack = parseInt(el.dataset.at); menu.classList.add('hide'); setupAudioMenu(); nudgeAfterSwitch(); };
    });
    return;
  }

  if (dashInst && dashInst.getTracksFor){
    const tracks = dashInst.getTracksFor('audio') || [];
    if (tracks.length >= 2){
      btn.classList.remove('hide');
      const current = dashInst.getCurrentTrackFor ? dashInst.getCurrentTrackFor('audio') : null;
      const items = tracks.map((t,i)=>`<div data-adq="${i}" class="${(current&&current.index===t.index)?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${(current&&current.index===t.index)?'✓ ':''}${escapeHtml(t.lang||('مسار '+(i+1)))}</div>`);
      menu.innerHTML = items.join('<div style="height:1px;background:var(--border)"></div>');
      menu.querySelectorAll('[data-adq]').forEach(el=>{
        el.onclick = (e)=>{ e.stopPropagation(); dashInst.setCurrentTrack(tracks[parseInt(el.dataset.adq)]); menu.classList.add('hide'); setupAudioMenu(); };
      });
      return;
    }
  }

  if (shakaInst && shakaInst.getAudioLanguagesAndRoles){
    const opts = shakaInst.getAudioLanguagesAndRoles() || [];
    if (opts.length >= 2){
      btn.classList.remove('hide');
      // نجيب المسار الصوتي النشط فعليًا حاليًا من variant tracks (active:true) عشان نعلّمه بالأحمر
      let curLang = null, curRole = null;
      try{
        const activeTrack = (shakaInst.getVariantTracks() || []).find(t=>t.active);
        if (activeTrack){ curLang = activeTrack.language; curRole = (activeTrack.audioRoles && activeTrack.audioRoles[0]) || null; }
      }catch(e){}
      const items = opts.map((o,i)=>{
        const isActive = curLang && o.language === curLang && (!o.role || o.role === curRole);
        return `<div data-asq="${i}" class="${isActive?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${isActive?'✓ ':''}${escapeHtml(o.language||('مسار '+(i+1)))}${o.role?(' — '+escapeHtml(o.role)):''}</div>`;
      });
      menu.innerHTML = items.join('<div style="height:1px;background:var(--border)"></div>');
      menu.querySelectorAll('[data-asq]').forEach(el=>{
        el.onclick = (e)=>{
          e.stopPropagation();
          const o = opts[parseInt(el.dataset.asq)];
          shakaInst.selectAudioLanguage(o.language, o.role);
          menu.classList.add('hide');
          setupAudioMenu(); nudgeAfterSwitch();
        };
      });
      return;
    }
  }

  btn.classList.add('hide');
}
