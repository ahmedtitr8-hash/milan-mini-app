<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
// إجبار تحميل جديد فعليًا من الشبكة (مرة كل 10 دقائق تقريبًا، لا كل فتحة) — لأن تيليجرام أحيانًا يبقي نافذة
// الـ WebApp حيّة بالخلفية بدل ما يغلقها كليًا، فسطر "مرة وحدة بالجلسة" القديم (sessionStorage) كان يتخطى
// إعادة التحميل ويعرض نسخة قديمة عالقة بالذاكرة أحيانًا. لكن جعل هذا يحصل بكل فتحة (نافذة 5 ثوانٍ) كان يضيف
// إعادة تحميل كاملة إضافية لكل فتحة تقريبًا (تبطئ فتح التطبيق كله بشكل ملحوظ، بما فيه أي مصدر iframe لاحق
// لأنه ينتظر هذا التحميل المضاعف أولاً) — رفعناها لنافذة أطول (10 دقائق) توازن بين الحداثة والسرعة
(function(){
  try{
    var url = new URL(location.href);
    var v = parseInt(url.searchParams.get('v') || '0', 10);
    if (!v || (Date.now() - v) > 600000){
      url.searchParams.set('v', Date.now());
      location.replace(url.toString());
    }
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>ZONE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/index.css">
</head>

    <div id="homeSections"><!-- تُبنى بالكامل من renderHome() — أقسام حرة (شبكة أندية/فيديو/بانر) بترتيب الأدمن --></div>
    <!-- يُعبّأ هذا القسم تلقائيًا من إعدادات لوحة التحكم (app_settings) عبر loadAppSettings() -->
    <div class="footer-zone" id="footerZone">

</div>
