<script>
function loadLibWithFallback(globalName, urls, idx){
  idx = idx || 0;
  if (idx >= urls.length) return;
  if (window[globalName]) return;
  const s = document.createElement('script');
  s.src = urls[idx];
  s.onload = function(){};
  s.onerror = function(){ loadLibWithFallback(globalName, urls, idx+1); };
  document.head.appendChild(s);
  setTimeout(function(){ if (!window[globalName]) loadLibWithFallback(globalName, urls, idx+1); }, 6000);
}
loadLibWithFallback('Hls', [
  'https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js',
  'https://unpkg.com/hls.js@1.5.13/dist/hls.min.js'
]);
loadLibWithFallback('dashjs', [
  'https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js',
  'https://unpkg.com/dashjs@4.7.4/dist/dash.all.min.js'
]);
loadLibWithFallback('mpegts', [
  'https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js',
  'https://unpkg.com/mpegts.js@1.7.3/dist/mpegts.min.js'
]);
loadLibWithFallback('shaka', [
  'https://cdn.jsdelivr.net/npm/shaka-player@4.10.5/dist/shaka-player.compiled.js',
  'https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.10.5/shaka-player.compiled.js',
  'https://unpkg.com/shaka-player@4.10.5/dist/shaka-player.compiled.js'
]);
function waitForLib(globalName, maxMs){
  return new Promise(resolve=>{
    if (window[globalName]) return resolve(true);
    const start = Date.now();
    const iv = setInterval(()=>{
      if (window[globalName]){ clearInterval(iv); resolve(true); }
      else if (Date.now() - start > maxMs){ clearInterval(iv); resolve(false); }
    }, 200);
  });
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --acc:#E87B00; --acc2:#FF9520;
  --bg:#070707; --card:#141414; --card2:#1c1c1c; --border:#262626;
  --txt:#F2F2F2; --mute:#7a7a7a; --live:#D32F2F; --tg-safe-top:0px;
}
body[data-club="milan"]{ --acc:#E2101A; --acc2:#FF4747; }
body[data-club="barca"]{ --acc:#A50044; --acc2:#1E6DE0; }
#tickerBar{position:fixed;top:0;left:0;right:0;height:var(--tg-safe-top);min-height:0;overflow:hidden;
  background:#000;z-index:10000;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;}
#tickerText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:11px;font-weight:800;color:#fff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--txt);font-family:'Cairo',sans-serif;height:100%;overflow:hidden;}
img{display:block;}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;}
.hide{display:none!important;}
::-webkit-scrollbar{display:none;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;height:100%;background:var(--bg);}

.top-bar{display:flex;align-items:center;gap:10px;padding:calc(14px + var(--tg-safe-top)) 14px 10px;flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--border);}
.embed-toolbar{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:20;gap:6px;transition:opacity .4s;}
.embed-toolbar.dim{opacity:.35;}
.embed-toolbar:not(.hide){display:flex;}
.embed-toolbar button{width:34px;height:34px;border-radius:8px;background:rgba(0,0,0,.6);border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.embed-toolbar button svg{width:17px;height:17px;fill:#fff;}
body.fs-lock .embed-toolbar{z-index:10000;}
.icon-btn{width:34px;height:34px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-btn svg{width:19px;height:19px;fill:#fff;}
.top-crest{height:28px;width:auto;max-width:64px;object-fit:contain;flex-shrink:0;}
.top-title{font-size:16px;font-weight:800;flex:1;}
.top-zone{font-size:12px;font-weight:800;color:var(--acc);letter-spacing:1px;}
.bdot{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.6s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.85}}

.live-indicator{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.5px;padding:0 2px;}
.live-indicator .ldot{width:7px;height:7px;border-radius:50%;background:var(--mute);flex-shrink:0;}
.live-indicator.at-edge{color:var(--live);}
.live-indicator.at-edge .ldot{background:var(--live);animation:blink 1.4s ease-in-out infinite;}
.live-indicator.delayed{color:var(--mute);}
.live-indicator.delayed .ldot{background:var(--mute);animation:none;}

.popup-menu .menu-active{color:var(--live)!important;font-weight:900!important;}

.player-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;}
#playerWrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;flex-shrink:0;}
#playerWrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#playerWrap.ar-cover video{object-fit:cover;}
#playerWrap.ar-fill video{object-fit:fill;}
#playerWrap.ar-9x16:not(.fs):not(:fullscreen){aspect-ratio:9/16;}
#playerWrap.ar-9x16 video{object-fit:cover;}
#playerWrap.ar-16x9:not(.fs):not(:fullscreen){aspect-ratio:16/9;}
#playerWrap.ar-16x9 video{object-fit:contain;}
#playerWrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;}
#playerPlaceholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0d0d0d,#000);color:var(--mute);font-size:12px;flex-direction:column;gap:10px;z-index:2;}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.08);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#liveBadgeP{position:absolute;top:10px;right:10px;z-index:6;background:var(--live);color:#fff;font-size:10px;font-weight:800;
  padding:4px 10px;border-radius:6px;display:none;align-items:center;gap:5px;}
#playerToast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);z-index:15;background:rgba(20,20,20,.94);
  color:#fff;font-size:12px;padding:9px 16px;border-radius:20px;max-width:88%;text-align:center;
  border:1px solid rgba(255,255,255,.1);transition:opacity .25s;}
#playerToast.hide{opacity:0;pointer-events:none;}
#playerWrap.fs #liveBadgeP{display:none!important;}
#btnFSClose{position:absolute;top:12px;right:12px;z-index:20;width:38px;height:38px;border-radius:50%;
  background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;}
#btnFSClose svg{width:18px;height:18px;fill:#fff;}
#playerWrap.fs .ctrl-layer #btnFSClose{display:flex;}
#playerWrap:not(.fs) #btnServers{display:none!important;}
.ctrl-layer{position:absolute;inset:0;z-index:5;opacity:0;transition:opacity .2s;pointer-events:none;}
#playerWrap.show .ctrl-layer{opacity:1;pointer-events:all;}
.ctrl-layer .top-grad{position:absolute;top:0;left:0;right:0;height:60px;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);}
.ctrl-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:46px;}
.ctrl-center button{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;}
.ctrl-center button svg{width:26px;height:26px;fill:#fff;}
.ctrl-center .big{width:64px;height:64px;background:rgba(0,0,0,.5);}
.ctrl-center .big svg{width:30px;height:30px;}
.ctrl-bottom{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;
  background:linear-gradient(to top,rgba(0,0,0,.9),transparent);display:flex;flex-direction:column;gap:6px;}
.seek-row{display:flex;align-items:center;gap:8px;}
.seek-row input[type=range]{flex:1;height:3px;-webkit-appearance:none;background:rgba(255,255,255,.25);border-radius:3px;}
.seek-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--acc);}
.time-txt{font-size:10px;color:#ddd;min-width:34px;text-align:center;}
.bottom-btns{display:flex;align-items:center;justify-content:center;gap:28px;}
.bottom-btns .left,.bottom-btns .right{display:flex;align-items:center;gap:14px;}
.bottom-btns button svg{width:19px;height:19px;fill:#fff;}
.live-flat{font-size:11px;font-weight:800;color:var(--live);display:flex;align-items:center;gap:5px;}

body.fs-lock{overflow:hidden!important;}
body.fs-lock .top-bar,body.fs-lock .nav-bar,body.fs-lock .below-player,body.fs-lock #tickerBar{display:none!important;}
#playerWrap.fs{position:fixed!important;top:0;left:0;z-index:9999!important;background:#000!important;}
@media (orientation:portrait){
  #playerWrap.fs{
    width:100dvh!important;height:100dvw!important;
    max-height:none!important;aspect-ratio:unset!important;transform-origin:0 0;
    transform:rotate(90deg) translateY(-100%)!important;
  }
}
@media (orientation:landscape){
  #playerWrap.fs{inset:0!important;width:100%!important;height:100%!important;
    max-height:none!important;aspect-ratio:unset!important;transform:none!important;}
}

.popup-menu{display:flex;flex-direction:column;max-height:230px;overflow-y:auto;overflow-x:hidden;}
#playerWrap.fs .popup-menu{flex-direction:row;max-height:none;max-width:75dvh;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;}
#playerWrap.fs .popup-menu > div{white-space:nowrap;flex-shrink:0;}

.below-player{padding:18px 16px;}
.tabs-row{display:flex;gap:10px;margin-bottom:14px;}
.tab-btn{flex:1;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--border);
  font-size:13px;font-weight:800;color:var(--mute);text-align:center;}
.tab-btn.active{background:var(--acc);color:#fff;border-color:var(--acc);}
.teams-row{display:flex;align-items:center;justify-content:center;gap:30px;padding:18px 0 8px;}
.team-col{display:flex;flex-direction:column;align-items:center;gap:9px;width:100px;}
.team-col .logo-holder{height:56px;display:flex;align-items:center;justify-content:center;}
.team-col .logo-holder img{max-height:100%;max-width:90px;width:auto;object-fit:contain;}
.team-col span{font-size:12px;font-weight:700;text-align:center;line-height:1.3;}
.vs-txt{font-size:13px;font-weight:900;color:var(--mute);}
.match-meta{text-align:center;font-size:11px;color:var(--mute);margin-top:-6px;margin-bottom:6px;}
.sec-title{font-size:13px;font-weight:800;color:var(--mute);margin:16px 0 10px;}
.chips-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.chip{padding:9px 16px;border-radius:9px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:700;}
.chip.active{background:var(--acc);border-color:var(--acc);color:#fff;}
.related-scroll{display:flex;gap:10px;overflow-x:auto;padding-top:4px;}
.info-note{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px;
  white-space:pre-line;font-size:13px;color:var(--txt);line-height:1.7;}
.info-note b{color:var(--acc);}

.hub-list{display:flex;flex-direction:column;gap:14px;margin-top:4px;}
.hub-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px 16px;transition:border-color .15s;}
.hub-card.active{border-color:var(--acc);}
.hub-card-top{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:10px;}
.hub-badge{background:var(--acc);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:6px;flex-shrink:0;}
.hub-comp{font-size:11px;color:var(--mute);font-weight:700;}
.hub-teams{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.hub-team{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0;}
.hub-logo{width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hub-logo img{max-width:100%;max-height:100%;object-fit:contain;}
.hub-team span{font-size:11.5px;font-weight:700;text-align:center;line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hub-time{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;padding:0 8px;}
.hub-t{font-size:15px;font-weight:900;color:var(--acc);}
.hub-d{font-size:10px;color:var(--mute);}
.hub-live{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:900;color:var(--live);white-space:nowrap;}
</style>
</head>
<body>
<div id="tickerBar"><div id="tickerText"></div></div>
<div id="app">

    <button class="icon-btn" onclick="closePlayer()">

          <div class="left">

            </button>
            <button onclick="event.stopPropagation();toggleQualityMenu()" id="btnQuality" class="hide">
              <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L1.66 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.4.34.66.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.24.09.5.02.66-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>

function normalizeEmbedUrl(url){
  const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|live\/|embed\/)|youtu\.be\/)([\w-]+)/i);
  if (yt) return { embed:true, url:`https://www.youtube.com/embed/${yt[1]}?autoplay=1&playsinline=1` };
  const vimeo = url.match(/vimeo\.com\/(\d+)/i);
  if (vimeo) return { embed:true, url:`https://player.vimeo.com/video/${vimeo[1]}?autoplay=1` };
  if (/dailymotion\.com\/(video|embed)/i.test(url)){
    const dm = url.match(/(?:dailymotion\.com\/(?:video|embed\/video)\/)([\w]+)/i);
    if (dm) return { embed:true, url:`https://www.dailymotion.com/embed/video/${dm[1]}?autoplay=1` };
  }
  if (/drive\.google\.com\/file\/d\//i.test(url)){
    const gd = url.match(/\/file\/d\/([\w-]+)/i);
    if (gd) return { embed:true, url:`https://drive.google.com/file/d/${gd[1]}/preview` };
  }
  if (/facebook\.com\/.+\/videos\//i.test(url) || /fb\.watch\//i.test(url)){
    return { embed:true, url:`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&autoplay=1` };
  }
  if (/twitch\.tv\//i.test(url)){
    const tw = url.match(/twitch\.tv\/(?:videos\/(\d+)|([\w]+))/i);
    if (tw){
      const parent = location.hostname;
      return { embed:true, url: tw[1]
        ? `https://player.twitch.tv/?video=${tw[1]}&parent=${parent}&autoplay=true`
        : `https://player.twitch.tv/?channel=${tw[2]}&parent=${parent}&autoplay=true` };
    }
  }
  if (/ok\.ru\/(video|videoembed)/i.test(url)){
    const ok = url.match(/ok\.ru\/video(?:embed)?\/(\d+)/i);
    if (ok) return { embed:true, url:`https://ok.ru/videoembed/${ok[1]}` };
  }
  if (/rumble\.com\/embed/i.test(url)) return { embed:true, url };
  if (/\/embed\//i.test(url) && !/\.(m3u8|mp4|webm|mov|m4v|ts|mpd)(\?|#|$)/i.test(url)) return { embed:true, url };
  return { embed:false, url };
}

function playHls(url, drmKeyIgnored, myGen){
  return new Promise((resolve, reject)=>{
    if (!(window.Hls && Hls.isSupported())){ reject(new Error('hls-unsupported')); return; }
    const v = video();
    let settled = false, mediaErrorRetries = 0;
    hlsInst = new Hls({
      enableWorker: false,
      xhrSetup: xhr => { xhr.withCredentials = false; },
      maxBufferLength: 20,
      maxMaxBufferLength: 40,
      liveSyncDurationCount: 3,
      liveMaxLatencyDurationCount: 7,
      manifestLoadingMaxRetry: 4,
      manifestLoadingRetryDelay: 1000,
      manifestLoadingMaxRetryTimeout: 12000,
      levelLoadingMaxRetry: 4,
      levelLoadingRetryDelay: 1000,
      levelLoadingMaxRetryTimeout: 12000,
      fragLoadingMaxRetry: 6,
      fragLoadingRetryDelay: 1000,
      fragLoadingMaxRetryTimeout: 15000
    });
    hlsInst.loadSource(url);
    hlsInst.attachMedia(v);
    hlsInst.on(Hls.Events.MANIFEST_PARSED, ()=>{
      if (settled || loadGeneration !== myGen) return; settled = true;
      hidePlaceholder(); playReliably(v); setupQualityMenu();
      resolve();
    });

    hlsInst.on(Hls.Events.AUDIO_TRACKS_UPDATED, ()=>{ if (loadGeneration === myGen) setupAudioMenu(); });
    hlsInst.on(Hls.Events.ERROR, (evt, data)=>{
      if (loadGeneration !== myGen) return;
      if (!settled){
        if (data.fatal){ settled = true; reject(new Error('hls-fatal:'+(data.details||''))); }
        return;
      }
      if (data.fatal && data.type === Hls.ErrorTypes.MEDIA_ERROR){
        mediaErrorRetries++;
        if (mediaErrorRetries <= 2){ try{ hlsInst.recoverMediaError(); }catch(e){} }
        else if (hlsInst.levels && hlsInst.levels.length > 1){
          let lowestIdx = 0, lowestBitrate = Infinity;
          hlsInst.levels.forEach((lvl,idx)=>{ if (lvl.bitrate < lowestBitrate){ lowestBitrate = lvl.bitrate; lowestIdx = idx; } });
          hlsInst.currentLevel = lowestIdx;
          showToastMsg('الجودة العالية غير مدعومة على هذا الجهاز، تم التحويل لجودة أقل تلقائيًا');
          try{ hlsInst.recoverMediaError(); }catch(e){}
          mediaErrorRetries = 0;
        }
      } else if (data.fatal && data.type === Hls.ErrorTypes.NETWORK_ERROR){
        try{ hlsInst.startLoad(); }catch(e){}
      }
    });
  });
}

function playDash(url, drmKey, myGen){
  return new Promise((resolve, reject)=>{
    if (!window.dashjs){ reject(new Error('dash-unsupported')); return; }
    const v = video();
    let settled = false;
    dashInst = dashjs.MediaPlayer().create();
    dashInst.updateSettings({ streaming:{
      text:{ defaultEnabled:false },
      retryAttempts:{ MPD:4, MediaSegment:4, InitializationSegment:4, IndexSegment:4, BitstreamSwitchingSegment:4 },
      retryIntervals:{ MPD:1000, MediaSegment:1000, InitializationSegment:1000, IndexSegment:1000, BitstreamSwitchingSegment:1000 }
    } });
    if (drmKey){
      try{
        const clearKeys = {};
        drmKey.split(',').forEach(pair=>{
          const [kid, key] = pair.split(':').map(x=>x && x.trim());
          if (kid && key) clearKeys[kid] = key;
        });
        if (Object.keys(clearKeys).length) dashInst.setProtectionData({ 'org.w3.clearkey': { clearkeys: clearKeys } });
      }catch(e){}
    }
    dashInst.initialize(v, url, false);
    const BUFFER_TARGET_SEC = 2.5, MAX_WAIT_MS = 2500, waitStart = Date.now();
    const tryStartPlayback = ()=>{
      if (settled || loadGeneration !== myGen) return;
      let buffered = 0;
      try{ buffered = dashInst.getBufferLength ? dashInst.getBufferLength('video') : 0; }catch(e){}
      if (buffered >= BUFFER_TARGET_SEC || (Date.now() - waitStart) >= MAX_WAIT_MS){
        settled = true; hidePlaceholder(); playReliably(v); resolve();
      } else {
        setTimeout(tryStartPlayback, 200);
      }
    };
    dashInst.on(dashjs.MediaPlayer.events.CAN_PLAY, ()=>{ if(settled || loadGeneration !== myGen) return; tryStartPlayback(); });
    dashInst.on(dashjs.MediaPlayer.events.ERROR, (e)=>{ if(settled || loadGeneration !== myGen) return; settled=true; reject(new Error('dash-fatal:'+((e&&e.error&&e.error.code)||''))); });
  });
}

function playMpegts(url, myGen){
  return new Promise((resolve, reject)=>{
    if (!(window.mpegts && mpegts.isSupported())){ reject(new Error('mpegts-unsupported')); return; }
    const v = video();
    let settled = false;

    try{
      mpegtsInst = mpegts.createPlayer({
        type: 'mse',
        isLive: true,
        url: url,
        hasAudio: true,
        hasVideo: true
      }, {
        enableStashBuffer: false,        // تفريغ المخزن التلقائي للبدء السريع
        stashInitialSize: 128,           // بدء القراءة بأقل قدر من البيانات (128KB)
        liveBufferLatencyChasing: true   // تقليل زمن التأخير التلقائي
      });

      mpegtsInst.attachMediaElement(v);

      mpegtsInst.on(mpegts.Events.ERROR, (errType, errDetail, errInfo)=>{
        if (settled || loadGeneration !== myGen) return;
        settled = true;
        reject(new Error('mpegts-fatal:' + errType + (errDetail ? (':' + errDetail) : '')));
      });

      const onLoadedData = ()=>{
        if (settled || loadGeneration !== myGen) return;
        settled = true;
        v.removeEventListener('loadeddata', onLoadedData);
        hidePlaceholder();
        playReliably(v);
        resolve();
      };

      v.addEventListener('loadeddata', onLoadedData);
      mpegtsInst.load();
      mpegtsInst.play().catch(()=>{});
    }catch(e){
      if (!settled){ settled = true; reject(e); }
    }
  });
}

function playNative(url, myGen){
  return new Promise((resolve, reject)=>{
    const v = video();
    let settled = false;
    const onOk = ()=>{
      if (settled || loadGeneration !== myGen) return; settled = true;
      v.removeEventListener('error', onErr);
      hidePlaceholder(); playReliably(v);
      resolve();
    };
    const onErr = ()=>{
      if (settled || loadGeneration !== myGen) return; settled = true;
      v.removeEventListener('loadeddata', onOk);
      const code = v.error && v.error.code;
      reject(new Error('native-fatal'+(code?(':'+code):'')));
    };
    v.addEventListener('loadeddata', onOk, { once:true });
    v.addEventListener('error', onErr, { once:true });
    try{
      v.src = url;
      v.load();
      v.play().catch(()=>{});
    }catch(e){ if (!settled){ settled = true; reject(e); } }
  });
}

let shakaInst = null;
async function playShaka(url, drmKey, myGen){
  if (!window.shaka) await waitForLib('shaka', 6000);
  if (!window.shaka){ throw new Error('shaka-unsupported'); }
  try{ shaka.polyfill.installAll(); }catch(e){}
  if (!(shaka.Player && shaka.Player.isBrowserSupported && shaka.Player.isBrowserSupported())){
    throw new Error('shaka-unsupported');
  }
  const v = video();
  try{ if (shakaInst) await shakaInst.destroy(); }catch(e){}
  if (loadGeneration !== myGen) throw new Error('superseded');
  shakaInst = new shaka.Player();
  await shakaInst.attach(v);
  try{
    shakaInst.configure({
      streaming:{
        retryParameters:{ maxAttempts:5, baseDelay:1000, backoffFactor:2, fuzzFactor:0.5, timeout:0 },
        bufferingGoal: 20,
        rebufferingGoal: 4,
        bufferBehind: 30
      },
      manifest:{
        retryParameters:{ maxAttempts:5, baseDelay:1000, backoffFactor:2, fuzzFactor:0.5, timeout:0 }
      }
    });
  }catch(e){}
  if (drmKey){
    try{
      const clearKeys = {};
      drmKey.split(',').forEach(pair=>{
        const [kid, key] = pair.split(':').map(x=>x && x.trim());
        if (kid && key) clearKeys[kid] = key;
      });
      if (Object.keys(clearKeys).length) shakaInst.configure({ drm:{ clearKeys } });
    }catch(e){}
  }
  await shakaInst.load(url);
  if (loadGeneration !== myGen) return;
  hidePlaceholder(); playReliably(v);
  setupQualityMenu();
}

function timeoutAfter(ms){ return new Promise(resolve=>setTimeout(()=>resolve('timeout'), ms)); }

let loadGeneration = 0;

async function loadSource(url, source){
  const myGen = ++loadGeneration;
  lastUrl = url;
  lastSource = source || null;
  state.currentSource = source || null;

  currentIsLive = false; liveIndicatorReady = false; baselineDelay = null; clearTimeout(baselineTimer); updateLiveIndicator();
  document.getElementById('liveBadgeP').style.display = 'none';
  await resetPlayerUI();

  if (!url){ showPlaceholder('تعذر تشغيل هذا الرابط', true); return; }

  if (/<iframe[\s>]/i.test(url)){
    const m = url.match(/src=["']([^"']+)["']/i);
    if (m && m[1]){ showEmbed(m[1].startsWith('http') ? m[1] : ('https:'+m[1])); setupQualityMenu(); return; }
  }

  const rawUrl = url.trim();
  const m = state.currentMatch;
  video().poster = (state.clubInfo && state.clubInfo.logo_url) || '';

  const forcedType = source && source.stream_type && source.stream_type !== 'auto' ? source.stream_type : null;
  const bestGuess = forcedType || detectTypeFromExtension(rawUrl) || (m && m.type) || 'vod';
  applyTypeUI(bestGuess);

  const norm = normalizeEmbedUrl(rawUrl);
  if (norm.embed){ showEmbed(norm.url); setupQualityMenu(); return; }

  bindVideoEvents();
  setupQualityMenu();

  const drmKey = (source && source.drm_key) ? String(source.drm_key).trim() : null;
  const isXtreamSource = isXtreamLiveUrl(rawUrl);
  const PROXY_BASE = isXtreamSource ? XTREAM_STREAM_PROXY : STREAM_PROXY;

  let playUrl = rawUrl;
  if (/^http:\/\//i.test(rawUrl) || isXtreamSource) {
    playUrl = `${PROXY_BASE}?url=${encodeURIComponent(rawUrl)}`;
  }

  function makeAttempt(engine, targetUrl){
    if (engine === 'mpegts') return playMpegts(targetUrl, myGen);
    if (engine === 'dash') return playDash(targetUrl, drmKey, myGen);
    return playHls(targetUrl, null, myGen);
  }

  let primaryEngine = 'hls';
  if (/\.mpd(\?|#|$)/i.test(rawUrl)){
    primaryEngine = 'dash';
  } else if (/\.m3u8?(\?|#|$)/i.test(rawUrl)){
    primaryEngine = 'hls';
  } else if (/\.ts(\?|#|$)/i.test(rawUrl) || isXtreamSource){
    primaryEngine = 'mpegts';
  }

  function raceAttempt(promiseFn, onErr){
    let err = null;
    return Promise.race([
      promiseFn.then(()=>'ok').catch(e=>{ err = e; return 'fail'; }),
      timeoutAfter(10000).then(r=>{ if(!err) err = new Error('انتهت المهلة بلا رد'); return r; })
    ]).then(r=>{ if (onErr) onErr(err); return r; });
  }

  let err1 = null;
  let result = await raceAttempt(makeAttempt(primaryEngine, playUrl), e=>err1=e);
  if (loadGeneration !== myGen) return;

  if (result !== 'ok' && isXtreamSource){
    const proxiedUrlMx = `${PROXY_BASE}?url=${encodeURIComponent(rawUrl)}&ua=mx`;
    await resetPlayerUI();
    result = await raceAttempt(makeAttempt(primaryEngine, proxiedUrlMx), e=>err1=e);
    if (loadGeneration !== myGen) return;
  }

  if (result !== 'ok'){
    const parts = [`${primaryEngine}: ${err1 ? err1.message : '؟'}`];
    showPlaceholder('تعذر تشغيل هذا الرابط — ' + parts.join(' | '), true);
  }
}

function resyncLiveEdge(forcePlay){
  if (!currentIsLive) return;
  const v = video();
  let engineEdge = null;
  if (hlsInst && isFinite(hlsInst.liveSyncPosition)){
    engineEdge = hlsInst.liveSyncPosition;
  } else if (shakaInst && shakaInst.seekRange){
    try{ const r = shakaInst.seekRange(); if (r && isFinite(r.end)) engineEdge = r.end; }catch(e){}
  }

  let bufferedTarget = null;
  try{
    const b = v.buffered;
    if (b && b.length){
      const end = b.end(b.length - 1);
      bufferedTarget = Math.max(0, end - 0.4);
    }
  }catch(e){}

  let target = null;
  if (bufferedTarget !== null && engineEdge !== null) target = Math.min(bufferedTarget, engineEdge);
  else target = (bufferedTarget !== null) ? bufferedTarget : engineEdge;

  if (target === null){
    try{
      if (v.seekable && v.seekable.length){
        const end = v.seekable.end(v.seekable.length - 1);
        if (isFinite(end)) target = end - 1;
      }
    }catch(e){}
  }
  if (target !== null && target - v.currentTime > 6){
    try{ v.currentTime = Math.max(0, target); }catch(e){}
    scheduleBaselineCapture();
  }
  if (forcePlay) playReliably(v);
}

let liveIndicatorDelayed = false;

function measureLiveDelay(v){
  let delay = 0, got = false;
  try{
    if (dashInst && dashInst.getCurrentLiveLatency){
      const lat = dashInst.getCurrentLiveLatency();
      if (isFinite(lat) && lat >= 0){ delay = lat; got = true; }
    }
  }catch(e){}
  if (!got && hlsInst){
    try{
      const syncPos = hlsInst.liveSyncPosition;
      if (isFinite(syncPos)){ delay = Math.max(0, syncPos - v.currentTime); got = true; }
    }catch(e){}
  }
  if (!got && shakaInst && shakaInst.getStats){
    try{
      const stats = shakaInst.getStats();
      if (stats && isFinite(stats.liveLatency) && stats.liveLatency >= 0){ delay = stats.liveLatency; got = true; }
    }catch(e){}
  }
  if (!got){
    try{
      if (v.seekable && v.seekable.length){
        const liveEdge = v.seekable.end(v.seekable.length - 1);
        if (isFinite(liveEdge)) delay = Math.max(0, liveEdge - v.currentTime);
      }
    }catch(e){}
  }
  return delay;
}

let baselineDelay = null;
let baselineTimer = null;

function scheduleBaselineCapture(){
  clearTimeout(baselineTimer);
  baselineTimer = setTimeout(()=>{
    if (!currentIsLive || !liveIndicatorReady) return;
    baselineDelay = measureLiveDelay(video());
  }, 4000);
}

function updateLiveIndicator(){
  const el = document.getElementById('btnLiveIndicator');
  if (!el) return;
  if (!currentIsLive || !liveIndicatorReady){ el.classList.add('hide'); return; }
  el.classList.remove('hide');
  const v = video();
  const rawDelay = measureLiveDelay(v);
  const delay = Math.max(0, rawDelay - (baselineDelay || 0));
  if (liveIndicatorDelayed){ if (delay <= 3) liveIndicatorDelayed = false; }
  else { if (delay > 7) liveIndicatorDelayed = true; }
  el.classList.toggle('at-edge', !liveIndicatorDelayed);
  el.classList.toggle('delayed', liveIndicatorDelayed);
}
setInterval(updateLiveIndicator, 1000);

function afterSmoothQualitySwitch(){ playReliably(video()); }

function nudgeAfterSwitch(){
  const v = video();
  playReliably(v);
  setTimeout(()=>{ if (v.paused || v.readyState < 3) resyncLiveEdge(true); }, 1200);
  setTimeout(()=>{ if (v.paused || v.readyState < 3) resyncLiveEdge(true); }, 2500);
}

function bindVideoEvents(){
  if (boundOnce) return; boundOnce=true;
  const v = video();
  try{ v.disablePictureInPicture = true; }catch(e){}
  try{ v.disableRemotePlayback = true; }catch(e){}
  v.addEventListener('contextmenu', e=>e.preventDefault());
  document.getElementById('playerWrap').addEventListener('contextmenu', e=>e.preventDefault());
  v.addEventListener('play', ()=>{ isPlayingState=true; updatePlayIcons(true); showCtrl(); });
  v.addEventListener('pause', ()=>{ isPlayingState=false; updatePlayIcons(false); });
  v.addEventListener('timeupdate', ()=>{
    if (!v.duration) return;
    const pct = (v.currentTime/v.duration)*100;
    document.getElementById('seekBar').value = pct;
    document.getElementById('timeCur').textContent = fmtSec(v.currentTime);
    document.getElementById('timeDur').textContent = fmtSec(v.duration);
  });
  v.addEventListener('webkitendfullscreen', ()=>{
    if (isFull){
      isFull = false;
      document.getElementById('playerWrap').classList.remove('fs');
      document.body.classList.remove('fs-lock');
    }
  });
  v.addEventListener('playing', ()=>{ liveIndicatorReady = true; scheduleBaselineCapture(); updateLiveIndicator(); });
}

function fmtSec(s){ if(!s||isNaN(s)) return '0:00'; const m=Math.floor(s/60), ss=Math.floor(s%60); return m+':'+(ss<10?'0':'')+ss; }

function seekBy(sec){

function setupQualityMenu(){
  const btn = document.getElementById('btnQuality');
  const menu = document.getElementById('qualityMenu');
  setupAudioMenu();

  const src = state.currentSource;
  const manualQ = (src && Array.isArray(src.qualities)) ? src.qualities.filter(q=>q && q.url) : [];
  if (manualQ.length){
    btn.classList.remove('hide');
    const activeUrl = lastUrl;
    const items = [`<div data-mq="-1" class="${src.url===activeUrl?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${src.url===activeUrl?'✓ ':''}الجودة الأساسية</div>`]
      .concat(manualQ.map((q,i)=>`<div data-mq="${i}" class="${q.url===activeUrl?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${q.url===activeUrl?'✓ ':''}${escapeHtml(q.label||('جودة '+(i+1)))}</div>`));
    menu.innerHTML = items.join('<div style="height:1px;background:var(--border)"></div>');
    menu.querySelectorAll('[data-mq]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        menu.classList.add('hide');
        const idx = parseInt(el.dataset.mq);
        const targetUrl = idx===-1 ? src.url : manualQ[idx].url;
        if (targetUrl && targetUrl !== activeUrl) loadSource(targetUrl, src);
      };
    });
    return;
  }

  if (hlsInst && hlsInst.levels && hlsInst.levels.length >= 2){
    btn.classList.remove('hide');
    const byHeight = new Map();
    hlsInst.levels.forEach((lvl,i)=>{
      const key = lvl.height || lvl.bitrate;
      if (!byHeight.has(key) || byHeight.get(key).lvl.bitrate < lvl.bitrate) byHeight.set(key, {lvl, i});
    });
    const uniq = [...byHeight.values()].sort((a,b)=>b.lvl.height-a.lvl.height);
    const activeLevel = hlsInst.autoLevelEnabled ? -1 : hlsInst.currentLevel;
    const items = [`<div data-l="-1" class="${activeLevel===-1?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${activeLevel===-1?'✓ ':''}تلقائي</div>`]
      .concat(uniq.map(({lvl,i})=>`<div data-l="${i}" class="${activeLevel===i?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${activeLevel===i?'✓ ':''}${lvl.height?lvl.height+'p':Math.round(lvl.bitrate/1000)+'kbps'}</div>`));
    menu.innerHTML = items.join('<div style="height:1px;background:var(--border)"></div>');
    menu.querySelectorAll('[data-l]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        hlsInst.nextLevel = parseInt(el.dataset.l);
        menu.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('menu-active', x===el));
        menu.classList.add('hide');
        afterSmoothQualitySwitch();
      };
    });
    return;
  }

  if (dashInst && dashInst.getBitrateInfoListFor){
    const rawList = dashInst.getBitrateInfoListFor('video') || [];
    const byH = new Map();
    rawList.forEach(l=>{ const key = l.height || l.bitrate; if (!byH.has(key) || byH.get(key).bitrate < l.bitrate) byH.set(key, l); });
    const list = [...byH.values()].sort((a,b)=>(b.height||0)-(a.height||0));
    if (list.length >= 2){
      btn.classList.remove('hide');
      let autoOn = true; try{ autoOn = !!dashInst.getSettings().streaming.abr.autoSwitchBitrate.video; }catch(e){}
      let curIdx = -1; try{ curIdx = dashInst.getQualityFor('video'); }catch(e){}
      const activeIdx = autoOn ? -1 : curIdx;
      const items = [`<div data-dq="-1" class="${activeIdx===-1?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${activeIdx===-1?'✓ ':''}تلقائي</div>`]
        .concat(list.map(l=>`<div data-dq="${l.qualityIndex}" class="${activeIdx===l.qualityIndex?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${activeIdx===l.qualityIndex?'✓ ':''}${l.height?l.height+'p':Math.round(l.bitrate/1000)+'kbps'}</div>`));
      menu.innerHTML = items.join('<div style="height:1px;background:var(--border)"></div>');
      menu.querySelectorAll('[data-dq]').forEach(el=>{
        el.onclick = (e)=>{
          e.stopPropagation();
          const idx = parseInt(el.dataset.dq);
          dashInst.updateSettings({ streaming:{ buffer:{ fastSwitchEnabled:false }, abr:{ autoSwitchBitrate:{ video: idx===-1 } } } });
          if (idx !== -1) dashInst.setQualityFor('video', idx);
          menu.querySelectorAll('[data-dq]').forEach(x=>x.classList.toggle('menu-active', x===el));
          menu.classList.add('hide');
          afterSmoothQualitySwitch();
        };
      });
      return;
    }
  }

  if (shakaInst && shakaInst.getVariantTracks){
    const rawTracks = (shakaInst.getVariantTracks() || []).filter(t=>t.height || t.bandwidth);
    const byHt = new Map();
    rawTracks.forEach(t=>{ const key = t.height || t.bandwidth; if (!byHt.has(key) || byHt.get(key).bandwidth < t.bandwidth) byHt.set(key, t); });
    const tracks = [...byHt.values()].sort((a,b)=>(b.height||0)-(a.height||0));
    if (tracks.length >= 2){
      btn.classList.remove('hide');
      const shakaAutoOn = (function(){ try{ return shakaInst.getConfiguration().abr.enabled; }catch(e){ return true; } })();
      const items = [`<div data-sq="-1" class="${shakaAutoOn?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${shakaAutoOn?'✓ ':''}تلقائي</div>`]
        .concat(tracks.map(t=>`<div data-sq="${t.id}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${t.height?t.height+'p':Math.round(t.bandwidth/1000)+'kbps'}</div>`));
      menu.innerHTML = items.join('<div style="height:1px;background:var(--border)"></div>');
      menu.querySelectorAll('[data-sq]').forEach(el=>{
        el.onclick = (e)=>{
          e.stopPropagation();
          const id = parseInt(el.dataset.sq);
          if (id === -1){ shakaInst.configure('abr.enabled', true); }
          else{
            shakaInst.configure('abr.enabled', false);
            const t = tracks.find(t=>t.id===id);
            if (t) shakaInst.selectVariantTrack(t, false);
          }
          menu.querySelectorAll('[data-sq]').forEach(x=>x.classList.toggle('menu-active', x===el));
          menu.classList.add('hide');
          afterSmoothQualitySwitch();
        };
      });
      return;
    }
  }

  btn.classList.add('hide');
}

function setupAudioMenu(){

      btn.classList.remove('hide');
      const current = dashInst.getCurrentTrackFor ? dashInst.getCurrentTrackFor('audio') : null;
      const items = tracks.map((t,i)=>`<div data-adq="${i}" class="${(current&&current.index===t.index)?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${(current&&current.index===t.index)?'✓ ':''}${escapeHtml(t.lang||('مسار '+(i+1)))}</div>`);
      menu.innerHTML = items.join('<div style="height:1px;background:var(--border)"></div>');
      menu.querySelectorAll('[data-adq]').forEach(el=>{
        el.onclick = (e)=>{ e.stopPropagation(); dashInst.setCurrentTrack(tracks[parseInt(el.dataset.adq)]); menu.classList.add('hide'); setupAudioMenu(); };
      });
      return;
    }
  }

  if (shakaInst && shakaInst.getAudioLanguagesAndRoles){
    const opts = shakaInst.getAudioLanguagesAndRoles() || [];
    if (opts.length >= 2){
      btn.classList.remove('hide');
      let curLang = null, curRole = null;
      try{
        const activeTrack = (shakaInst.getVariantTracks() || []).find(t=>t.active);
        if (activeTrack){ curLang = activeTrack.language; curRole = (activeTrack.audioRoles && activeTrack.audioRoles[0]) || null; }
      }catch(e){}
      const items = opts.map((o,i)=>{
        const isActive = curLang && o.language === curLang && (!o.role || o.role === curRole);
        return `<div data-asq="${i}" class="${isActive?'menu-active':''}" style="padding:10px 14px;font-size:12px;font-weight:700;color:#fff;">${isActive?'✓ ':''}${escapeHtml(o.language||('مسار '+(i+1)))}${o.role?(' — '+escapeHtml(o.role)):''}</div>`;
      });
      menu.innerHTML = items.join('<div style="height:1px;background:var(--border)"></div>');
      menu.querySelectorAll('[data-asq]').forEach(el=>{
        el.onclick = (e)=>{
          e.stopPropagation();
          const o = opts[parseInt(el.dataset.asq)];
          shakaInst.selectAudioLanguage(o.language, o.role);
          menu.classList.add('hide');
          setupAudioMenu(); nudgeAfterSwitch();
        };
      });
      return;
    }
  }

  btn.classList.add('hide');
}

function setServersButtonVisibility(){
  const btn = document.getElementById('btnServers');

let serverMenuPage = 0;
const SERVERS_PER_PAGE = 9;

function renderServerMenuPage(){
  const panel = document.getElementById('serverMenu');
  const list = currentTabSources();
  const activeUrl = lastUrl;
  const start = serverMenuPage * SERVERS_PER_PAGE;
  const pageItems = list.slice(start, start + SERVERS_PER_PAGE).map((s,i)=>({ s, realIdx: start + i }));
  const activePos = pageItems.findIndex(it => it.s.url === activeUrl);
  if (activePos !== -1){
    const activeItem = pageItems.splice(activePos, 1)[0];
    pageItems.splice(Math.floor(pageItems.length / 2), 0, activeItem);
  }
  const chipStyle = 'padding:10px 14px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;cursor:pointer;';
  let html = pageItems.map(({s, realIdx})=>{
    const active = s.url===activeUrl;
    return `<div data-srv="${realIdx}" style="${chipStyle}${active?'background:var(--acc);':''}">${active?'✓ ':''}${escapeHtml(s.label||('سيرفر '+(realIdx+1)))}</div>`;
  }).join('<div style="height:1px;background:var(--border)"></div>');
  if (list.length > SERVERS_PER_PAGE){
    html += `<div style="height:1px;background:var(--border)"></div>
      <div data-srv-next="1" style="${chipStyle}display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
    </div>`;
  }
  panel.innerHTML = html;
  panel.querySelectorAll('[data-srv]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); pickSourceFromMenu(parseInt(el.dataset.srv,10)); };
  });
  const nextBtn = panel.querySelector('[data-srv-next]');
  if (nextBtn){
    nextBtn.onclick = (e)=>{
      e.stopPropagation();
      const totalPages = Math.ceil(list.length / SERVERS_PER_PAGE);
      serverMenuPage = (serverMenuPage + 1) % totalPages;
      renderServerMenuPage();
    };
  }
}

function toggleServerMenu(){
  document.getElementById('aspectMenu').classList.add('hide');
  document.getElementById('qualityMenu').classList.add('hide');
  document.getElementById('audioMenu').classList.add('hide');
  const menu = document.getElementById('serverMenu');

  const willOpen = menu.classList.contains('hide');

    serverMenuPage = 0;
    renderServerMenuPage();
  }
  menu.classList.toggle('hide');
  icon.innerHTML = willOpen
    ? '<path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>'
    : '<path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6z"/>';
}

function pickSourceFromMenu(i){
  const list = currentTabSources();
  if (!list[i]) return;
  loadSource(list[i].url, list[i]);
  document.getElementById('serverMenu').classList.add('hide');
  document.getElementById('btnServersIcon').innerHTML = '<path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6z"/>';
  document.querySelectorAll('#chipsRow .chip').forEach((c,idx)=>c.classList.toggle('active', idx===i));

function setAspect(mode){
  const w = document.getElementById('playerWrap');
  w.classList.remove('ar-cover','ar-fill','ar-9x16','ar-16x9');
  if (mode) w.classList.add('ar-'+mode);
  document.getElementById('aspectMenu').querySelectorAll('[data-ar]').forEach(el=>{
    el.classList.toggle('menu-active', el.dataset.ar === (mode||''));
  });
  document.getElementById('aspectMenu').classList.add('hide');
}

const EMBED_ASPECT_CYCLE = ['', 'cover', 'fill', '9x16', '16x9'];
let embedAspectIdx = 0;

function cycleEmbedAspect(){
  embedAspectIdx = (embedAspectIdx + 1) % EMBED_ASPECT_CYCLE.length;
  setAspect(EMBED_ASPECT_CYCLE[embedAspectIdx]);
  armEmbedToolbarDim();
}

let embedDimTimer = null;
function armEmbedToolbarDim(){
  const bar = document.getElementById('embedToolbar');
  bar.classList.remove('dim');
  clearTimeout(embedDimTimer);
  embedDimTimer = setTimeout(()=>{ bar.classList.add('dim'); }, 4000);
}

document.getElementById('aspectMenu').querySelectorAll('[data-ar]').forEach(el=>{
  el.onclick = (e)=>{ e.stopPropagation(); setAspect(el.dataset.ar); };
});

function toggleFS(){
  if (isFull) { exitFS(); return; }
  const w = document.getElementById('playerWrap');
  const v = video();
  const tg = window.Telegram && window.Telegram.WebApp;
  isFull = true;
  document.body.classList.add('fs-lock');

  if (isIOSDevice() && v.webkitEnterFullscreen && !document.getElementById('embedFrame')){
    try{ v.webkitEnterFullscreen(); showCtrl(); return; }catch(e){}
  }

  if (tg && typeof tg.requestFullscreen === 'function'){
    try{ tg.requestFullscreen(); }catch(e){}
  }

  const root = document.documentElement;
  const reqFS = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
  if (reqFS){ Promise.resolve(reqFS.call(root)).catch(()=>{}); }

  w.classList.add('fs');
  if (document.getElementById('embedFrame')){
    document.getElementById('btnEmbedFS').classList.add('hide');
    document.getElementById('btnEmbedFSClose').classList.remove('hide');
  }
  showCtrl();
}

function exitFS(){
  isFull = false;
  const w = document.getElementById('playerWrap');
  w.classList.remove('fs');
  document.body.classList.remove('fs-lock');
  if (document.getElementById('embedFrame')){
    document.getElementById('btnEmbedFS').classList.remove('hide');
    document.getElementById('btnEmbedFSClose').classList.add('hide');
  }
  const exitter = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
  if ((document.fullscreenElement || document.webkitFullscreenElement) && exitter){
    try{ exitter.call(document); }catch(e){}
  }
  if (video().webkitDisplayingFullscreen && video().webkitExitFullscreen){ try{ video().webkitExitFullscreen(); }catch(e){} }
}

const DRAG_THRESHOLD = 8;
function enableFsMenuDragScroll(){
  document.querySelectorAll('.popup-menu').forEach(el=>{
    if (el.dataset.dragBound) return;
    el.dataset.dragBound = '1';
    let startY = 0, startScroll = 0, dragging = false, movedFar = false;
    el.addEventListener('touchstart', (e)=>{
      if (!document.getElementById('playerWrap').classList.contains('fs')) return;
      dragging = true;
      movedFar = false;
      startY = e.touches[0].clientY;
      startScroll = el.scrollLeft;
    }, {passive:true});
    el.addEventListener('touchmove', (e)=>{
      if (!dragging) return;
      const dy = e.touches[0].clientY - startY;
      if (Math.abs(dy) > DRAG_THRESHOLD) movedFar = true;
      el.scrollLeft = startScroll - dy;
    }, {passive:true});
    el.addEventListener('click', (e)=>{
      if (movedFar){ e.stopPropagation(); e.preventDefault(); }
    }, true);
    el.addEventListener('touchend', ()=>{ dragging = false; }, {passive:true});
    el.addEventListener('touchcancel', ()=>{ dragging = false; movedFar = false; }, {passive:true});
  });
}
enableFsMenuDragScroll();
